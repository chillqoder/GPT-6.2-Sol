  }, true);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const { sin, cos, exp, sqrt, PI, abs, atan2 } = Math;
const TAU = PI * 2;
const { clamp, lerp, smoothstep } = THREE.MathUtils;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const RGB = hex => new THREE.Color(hex);
const WIDTH = 8, DEPTH = 4, TOP = 5, WATER = 4.55;
const OUTLET = V(2.52, 1.83, -1.25);
const UP = V(0, 1, 0);
const NEG_Y = V(0, -1, 0);
const simTime = { value: 0 };
const main = document.getElementById('aquarium');
const renderer = new THREE.WebGLRenderer({ alpha: false, antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;

function randomSource(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}
const random = randomSource(81726);
const between = (a, b, rng = random) => lerp(a, b, rng());
const sample = (items, rng = random) => items[Math.floor(rng() * items.length)];

function group(name, parent, x = 0, y = 0, z = 0) {
  const object = new THREE.Group();
  object.name = name;
  object.position.set(x, y, z);
  parent.add(object);
  return object;
}
const sphere = new THREE.SphereGeometry(1, 24, 16);
const smallSphere = new THREE.SphereGeometry(1, 12, 8);
const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 10);
const unitBox = new THREE.BoxGeometry();
const roundBox = new RoundedBoxGeometry(1, 1, 1, 2, .13);
const bodyScene = new THREE.Scene();
const waterScene = new THREE.Scene();
const bubbleScene = new THREE.Scene();
const glassScene = new THREE.Scene();

function mesh(parent, geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  parent.add(object);
  return object;
}
function oval(parent, material, x, y, z, sx, sy, sz, geometry = sphere) {
  const object = mesh(parent, geometry, material, x, y, z);
  object.scale.set(sx, sy, sz);
  return object;
}

  return oval(parent, material, x, y, z, sx, sy, sz, beveled ? roundBox : unitBox);
}
function cylinder(parent, material, x, y, z, radius, height, sides = 32) {
  return mesh(parent, new THREE.CylinderGeometry(radius, radius, height, sides), material, x, y, z);
}
function tube(parent, points, radius, material, segments = 24, sides = 6) {
  return mesh(parent, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), segments, radius, sides), material);
}
const rodDirection = V();
function aimRod(object, from, to, radius) {
  rodDirection.subVectors(to, from);
  object.position.copy(from).addScaledVector(rodDirection, .5);
  object.scale.set(radius, rodDirection.length(), radius);
  object.quaternion.setFromUnitVectors(UP, rodDirection.normalize());
}
function rod(parent, from, to, radius, material) {
  const object = mesh(parent, unitCylinder, material);
  aimRod(object, from, to, radius);
  return object;
}
function grounded(object) {
  object.traverse(node => {
    if (node.isMesh && !node.material.transparent) {
      node.castShadow = true;
      node.receiveShadow = true;
    }
  });
  return object;
}

// World-space treatments for stone, scale, ceramic and plant materials.
const WAVES = [
  [.022, 3.0, 1.3, 1.45, .2],
  [.013, -2.4, 3.8, -1.76, 1.7],
  [.009, 5.3, -1.8, 2.17, 3.1],
  [.006, 3.3, 6.2, -2.35, .5]
];
const waveGLSL = WAVES.map(([a, x, z, v, ph]) =>
  `height += ${a} * sin(dot(p, vec2(${x.toFixed(2)}, ${z.toFixed(2)})) + t * ${v.toFixed(2)} + ${ph.toFixed(2)});`).join('\n');
const surfaceWave = `float baseWave(vec2 p, float t) { float height = 0.; ${waveGLSL} return height; }`;

function surfaceMaterial(color, options = {}) {
  const { roughness = .64, metalness = 0, coat = 0, vertexColors = false,
    double = false, grain = 0, frequency = 24, caustics = .24, detail = '' } = options;
  const material = new THREE.MeshPhysicalMaterial({
    color, roughness, metalness, clearcoat: coat, clearcoatRoughness: .26, vertexColors,
    side: double ? THREE.DoubleSide : THREE.FrontSide

  material.onBeforeCompile = shader => {
    shader.uniforms.aquaTime = simTime;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 aquaWorld; varying vec3 aquaLocal;')
      .replace('#include <project_vertex>', `
        vec4 aquaPosition = vec4(transformed, 1.);
        #ifdef USE_INSTANCING
          aquaPosition = instanceMatrix * aquaPosition;
        #endif
        aquaWorld = (modelMatrix * aquaPosition).xyz;
        aquaLocal = position;
        #include <project_vertex>`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 aquaWorld; varying vec3 aquaLocal; uniform float aquaTime;
        float patternHash(vec3 p) { return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
        float patternNoise(vec3 p) {
          vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
          return mix(mix(mix(patternHash(i),patternHash(i+vec3(1,0,0)),f.x),
                         mix(patternHash(i+vec3(0,1,0)),patternHash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(patternHash(i+vec3(0,0,1)),patternHash(i+vec3(1,0,1)),f.x),
                         mix(patternHash(i+vec3(0,1,1)),patternHash(i+vec3(1,1,1)),f.x),f.y),f.z);
        }
        ${surfaceWave}
        float causticPattern(vec2 p, float t) {
          vec2 s = p * 2.5;
          float a = sin(s.x * 1.13 + sin(s.y * 1.4 - t*.55)*1.3 + t*.75);
          float b = sin(s.y * 1.21 + sin(s.x * 1.14 + t*.62)*1.45 - t*.52);
          float c = sin((s.x+s.y)*.82 + sin(s.y*1.5+t*.34)*.92);
          return pow(1.-clamp(abs(a+b+c*.72)*.57,0.,1.),8.);
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        ${grain ? `float pat = patternNoise(aquaWorld*${frequency.toFixed(2)});
          diffuseColor.rgb *= 1. + ${grain.toFixed(3)}*(pat*1.5 + patternNoise(aquaWorld*${(frequency*.3).toFixed(2)})*.6 - .98);` : ''}
        ${detail}`)
      .replace('#include <opaque_fragment>', `
        ${caustics ? `
        float inWater = step(aquaWorld.y, 4.53) * (1.-step(3.96,abs(aquaWorld.x))) * (1.-step(1.96,abs(aquaWorld.z)));
        vec2 ray = aquaWorld.xz + aquaWorld.y * vec2(.39,-.23);
        ray += vec2(baseWave(ray,aquaTime),baseWave(ray.yx,aquaTime))*3.2;
        float caustic = causticPattern(ray,aquaTime) * (.73+.27*sin(aquaWorld.x*1.1+aquaTime*.55));
        float incidence = .25 + max(0.,dot(normal,normalize((viewMatrix * vec4(.28,.92,-.26,0.)).xyz)))*.75;
        outgoingLight += diffuseColor.rgb * vec3(.78,1.09,1.04) * caustic * incidence * inWater * ${caustics.toFixed(3)};` : ''}
        #include <opaque_fragment>`);
  };
  material.customProgramCacheKey = () => [grain, frequency, caustics, detail].join('|');
  return material;
}

const reflectionScene = new THREE.Scene();
reflectionScene.background = RGB('#142d43');
const softboxMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.6, 4.5, 5.1), side: THREE.DoubleSide });
const warmboxMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.7, 2.15, 1.56), side: THREE.DoubleSide });
const lightPanel = mesh(reflectionScene, new THREE.PlaneGeometry(10, 5), softboxMat, -1, 5, -1);
lightPanel.rotation.x = PI / 2;
mesh(reflectionScene, new THREE.PlaneGeometry(5, 4), warmboxMat, -3, 2, 5);
const stripLight = mesh(reflectionScene, new THREE.PlaneGeometry(1.0, 6), softboxMat, 5, 1.2, -1);
stripLight.rotation.y = PI / 2;
const pmrem = new THREE.PMREMGenerator(renderer);
const environment = pmrem.fromScene(reflectionScene, .04, .1, 25, { size: 128 });
bodyScene.environment = environment.texture;
bodyScene.environmentIntensity = .32;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(34, 1, .12, 130);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .085;
controls.zoomSpeed = .78;
controls.rotateSpeed = .71;
controls.panSpeed = .6;
controls.minPolarAngle = .12;
controls.maxPolarAngle = 1.59;
controls.minDistance = 5.8;
controls.maxDistance = 39;
const homeTarget = V(0, 1.43, 0);
const homeDirection = V(.46, .365, .875).normalize();
let homeDistance = 14;
function resetView() {
  const damping = controls.enableDamping;
  controls.enableDamping = false;
  controls.update();
  controls.target.copy(homeTarget);
  camera.position.copy(homeTarget).addScaledVector(homeDirection, homeDistance);
  controls.update();
  controls.enableDamping = damping;
}
const cameraOffset = V();
const minCameraTarget=V(-2.5,.75,-1.05), maxCameraTarget=V(2.5,3.8,1.05);
const framingCamera = camera.clone();
const framingCorner = V();
function updateCamera(delta) {
  controls.update(delta);
  cameraOffset.copy(camera.position).sub(controls.target);
  controls.target.clamp(minCameraTarget,maxCameraTarget);
  camera.position.copy(controls.target).add(cameraOffset);
  // Push the camera along its orbit ray to the boundary of the padded tank box.
  const boundaryX = cameraOffset.x >= 0 ? 4.55 : -4.55;
  const boundaryY = cameraOffset.y >= 0 ? 5.6 : -.85;
  const boundaryZ = cameraOffset.z >= 0 ? 2.55 : -2.55;
  const exit = Math.min(
    abs(cameraOffset.x) > .00001 ? (boundaryX-controls.target.x)/cameraOffset.x : Infinity,
    abs(cameraOffset.y) > .00001 ? (boundaryY-controls.target.y)/cameraOffset.y : Infinity,
    abs(cameraOffset.z) > .00001 ? (boundaryZ-controls.target.z)/cameraOffset.z : Infinity
  );
  if (exit > 1) camera.position.copy(controls.target).addScaledVector(cameraOffset, exit);
  camera.lookAt(controls.target);
}

function createStudio() {
  const studio = group('Navy studio and pedestal', bodyScene);
  const studioGradient=`
    vec3 studioGradient(vec3 d){
      float halo=exp(-pow(abs((d.y+.29)*2.72),2.));
      vec3 color=mix(vec3(.0025,.006,.013),vec3(.009,.037,.055),halo);
      return color+vec3(.004,.007,.014)*smoothstep(.04,.92,d.y);
    }`;
  const backdrop = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 point; void main(){
      point=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 point; ${studioGradient}
      void main(){ gl_FragColor=vec4(studioGradient(normalize(point-cameraPosition)),1.); }`
  });
  const sky = mesh(studio, new THREE.SphereGeometry(78, 32, 16), backdrop, 0, 2, 0);
  sky.renderOrder = -100;
  const plinth = surfaceMaterial('#171f2b', { roughness: .39, grain: .11, caustics: 0, coat: .2 });
  const lip = surfaceMaterial('#25333e', { roughness: .33, metalness: .25, caustics: 0 });
  box(studio, plinth, 0, -.47, 0, 8.27, .65, 4.24, true);
  box(studio, lip, 0, -.16, 0, 8.35, .10, 4.30, true);
  box(studio, plinth, 0, -.81, 0, 8.38, .12, 4.36, true);
  const floor = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 p; varying vec3 world; void main(){
      p=position.xy; world=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec2 p; varying vec3 world; ${studioGradient}
      void main(){
      vec2 edge=max(abs(p)-vec2(3.87,1.87),vec2(0.));
      float contact=exp(-dot(edge,edge)*2.6);
      float light=exp(-dot(p*vec2(.073,.085),p*vec2(.073,.085)));
      vec3 c=mix(vec3(.008,.023,.044),vec3(.021,.050,.064),light);
      vec3 distanceToCamera=world-cameraPosition;
      vec3 sky=studioGradient(normalize(distanceToCamera));
      gl_FragColor=vec4(mix(c*(1.-contact*.83),sky,smoothstep(15.,44.,length(distanceToCamera))),1.); }`
  });
  const ground = mesh(studio, new THREE.PlaneGeometry(130, 130), floor, 0, -.875, 0);
  ground.rotation.x = -PI / 2;

  const ambient = new THREE.HemisphereLight('#d8f5ff', '#454038', 1.09);
  bodyScene.add(ambient);
  const key = new THREE.DirectionalLight('#fff0d9', 2.45);
  key.position.set(-3.8, 9.5, 4.1);
  key.target.position.set(0, .35, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -5.7, right: 5.7, top: 5.3, bottom: -4.5, near: .5, far: 17 });
  key.shadow.normalBias = .025;
  key.shadow.bias = -.00024;
  key.shadow.radius = 2.1;
  key.shadow.autoUpdate = false;
  key.shadow.needsUpdate = true;
  bodyScene.add(key, key.target);
  const back = new THREE.DirectionalLight('#89e3ff', 1.52);
  back.position.set(2, 6.6, -5.5);
  const fill = new THREE.DirectionalLight('#a7e0fc', .80);
  fill.position.set(5, 3.5, 6);
  bodyScene.add(back, fill);
  return key;
}
const shadowLight = createStudio();

const capture = new THREE.WebGLRenderTarget(1, 1, {
  depthTexture: new THREE.DepthTexture(1, 1, THREE.UnsignedIntType), type: THREE.HalfFloatType
});
capture.samples = 2;
const liquidColor = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false, type: THREE.HalfFloatType });
const wetColor = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false, type: THREE.HalfFloatType });
const opticalSize = { value: new THREE.Vector2(1, 1) };
const bufferSize = { value: new THREE.Vector2(1, 1) };
const inverseProjection = { value: camera.projectionMatrixInverse };
const cameraWorld = { value: camera.matrixWorld };
const rippleData = Array.from({ length: 8 }, () => new THREE.Vector3(0, 0, -30));
const screen = new THREE.Scene();
const screenCamera = new THREE.Camera();
const blitMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: { image: { value: capture.texture } },
  vertexShader: `varying vec2 screenUV; void main(){ screenUV=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `varying vec2 screenUV; uniform sampler2D image;
    void main(){
      gl_FragColor=vec4(texture2D(image,screenUV).rgb,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
mesh(screen, new THREE.PlaneGeometry(2, 2), blitMat).frustumCulled = false;

const rippleSource = `
  uniform vec3 ripples[8];
  ${surfaceWave}
  float waterHeight(vec2 p, float t){
    float h=baseWave(p,t);
    for(int i=0;i<8;i++){
      float age=t-ripples[i].z;
      if(age<0. || age>1.8) continue;
      float r=length(p-ripples[i].xy), ring=r-age*.68;
      h+=.014*cos(ring*42.)*exp(-abs(ring)*12.)*(1.-age/1.8)*smoothstep(0.,.08,age);
    }
    return h;
  }`;
const opticalSource = `
  uniform sampler2D sceneColor, sceneDepth;
  uniform vec2 viewport;
  uniform mat4 inverseProjection, cameraWorld, opticalProjection;
  vec3 viewPoint(vec2 uv,float depth){
    vec4 p=inverseProjection*vec4(uv*2.-1.,depth*2.-1.,1.);
    return p.xyz/p.w;
  }
  float edgeFade(vec2 uv){
    vec2 e=smoothstep(vec2(.001),vec2(.033),min(uv,1.-uv));
    return e.x*e.y;
  }
  float fresnel(float ior, float cosine){
    float r=(1.-ior)/(1.+ior);
    return mix(r*r,1.,pow(1.-clamp(cosine,0.,1.),5.));
  }
  vec3 reflectedStudio(vec3 ray){
    float panel=exp(-pow(abs((ray.x+.28)*2.05),4.)-pow(abs((ray.z+.12)*2.45),4.))*smoothstep(0.,.72,ray.y);
    float strip=exp(-pow(abs((ray.x-.57)*12.),2.))*(1.-smoothstep(.1,.82,abs(ray.y-.17)))*smoothstep(-.11,.55,-ray.z);
    float soft=exp(-pow(abs((ray.x+.48)*4.2),2.))*exp(-pow(abs((ray.y-.4)*2.6),2.));
    return vec3(.012,.043,.068)+vec3(.71,1.10,1.14)*panel+vec3(.34,.67,.82)*strip+vec3(.33,.30,.24)*soft;
  }`;
function opticalUniforms(texture, viewport) {
  return { sceneColor: { value: texture }, sceneDepth: { value: capture.depthTexture }, viewport, inverseProjection, cameraWorld, opticalProjection: { value: camera.projectionMatrix } };
}
function createWater() {
  const material = new THREE.ShaderMaterial({
    uniforms: { ...opticalUniforms(liquidColor.texture, opticalSize), clock: simTime, ripples: { value: rippleData } },
    depthTest: false, depthWrite: false,
    vertexShader: `
      uniform float clock;
      varying vec3 p; varying vec3 viewPos;
      ${rippleSource}
      void main(){
        p=position;
        p.y+=waterHeight(p.xz,clock);
        vec4 eye=modelViewMatrix*vec4(p,1.);
        viewPos=eye.xyz; gl_Position=projectionMatrix*eye;
      }`,
    fragmentShader: `
      uniform float clock;
      varying vec3 p; varying vec3 viewPos;
      ${rippleSource}
      ${opticalSource}
      void main(){
        vec2 uv=gl_FragCoord.xy/viewport;
        float d=texture2D(sceneDepth,uv).r;
        if(d+.000003<gl_FragCoord.z) discard;
        vec2 x=vec2(.014,0.), z=x.yx;
        float dx=waterHeight(p.xz+x,clock)-waterHeight(p.xz-x,clock);
        float dz=waterHeight(p.xz+z,clock)-waterHeight(p.xz-z,clock);
        vec3 n=normalize(vec3(-dx,.028,-dz));
        vec3 i=normalize(p-cameraPosition);
        vec3 straight=viewPoint(uv,d);
        float distanceUnder=max(0.,viewPos.z-straight.z);
        vec3 r=refract(i,n,1./1.333);
        vec3 rView=mat3(viewMatrix)*r;
        vec4 bend=opticalProjection*vec4(viewPos+rView*min(distanceUnder/max(.12,-rView.z),3.0),1.);
        vec2 offset=clamp(bend.xy/bend.w*.5+.5-uv,vec2(-.064),vec2(.064));
        vec2 shifted=uv+offset;
        float shiftedDepth=texture2D(sceneDepth,clamp(shifted,0.,1.)).r;
        float shiftedPath=viewPos.z-viewPoint(shifted,shiftedDepth).z;
        float good=edgeFade(shifted)*smoothstep(.014,.18,shiftedPath);
        vec2 uv2=uv+offset*good;
        vec3 through=texture2D(sceneColor,uv2).rgb;
        vec3 absorption=exp(-vec3(.108,.046,.022)*min(distanceUnder,5.));
        through=through*absorption+vec3(.007,.054,.072)*(1.-absorption)*2.2;
        vec3 reflection=reflectedStudio(reflect(i,n));
        float f=fresnel(1.333,dot(-i,n));
        float edge=min(3.94-abs(p.x),1.94-abs(p.z));
        float meniscus=(1.-smoothstep(.006,.036,edge))*(.72+.28*cos(p.x*8.+p.z*11.+clock*1.45));
        float glint=pow(max(0.,dot(reflect(i,n),normalize(vec3(-.24,.92,-.33)))),82.);
        vec3 color=mix(through,reflection,f)+vec3(.29,.55,.60)*(meniscus*.53+glint*.26);
        gl_FragColor=vec4(color,1.);
      }`
  });

// Navigation sweeps the whole animated envelope against global limits and solid obstacles.
function clearSegment(from, to, radius, height) {
  for (const item of obstacles) {
    if (Math.min(from.y,to.y)-height > item.top) continue;
    const minX=item.x-item.halfX-radius, maxX=item.x+item.halfX+radius;
    const minZ=item.z-item.halfZ-radius, maxZ=item.z+item.halfZ+radius;
    if (Math.max(from.x,to.x)<minX || Math.min(from.x,to.x)>maxX ||
        Math.max(from.z,to.z)<minZ || Math.min(from.z,to.z)>maxZ) continue;
    let enter=0, leave=1;
    const dx=to.x-from.x, dz=to.z-from.z, dy=to.y-from.y;
    if(abs(dx)>1e-6){
      const a=(minX-from.x)/dx,b=(maxX-from.x)/dx;
      enter=Math.max(enter,Math.min(a,b));
      leave=Math.min(leave,Math.max(a,b));
    }
    if(abs(dz)>1e-6){
      const a=(minZ-from.z)/dz,b=(maxZ-from.z)/dz;
      enter=Math.max(enter,Math.min(a,b));
      leave=Math.min(leave,Math.max(a,b));
    }
    if(dy>.000001) leave=Math.min(leave,(item.top+height-from.y)/dy);
    if(dy<-.000001) enter=Math.max(enter,(item.top+height-from.y)/dy);
    if(enter<=leave) return false;
  }
  return true;
}
function fishBounds(position, state) {
  position.x=clamp(position.x,-3.92+state.radius,3.92-state.radius);
  position.z=clamp(position.z,-1.92+state.radius,1.92-state.radius);
  position.y=clamp(position.y,.36+state.height,4.44-state.height);
  return position;
}
function startSwimmer(fish, style) {
  const { position, initialTarget, zone, speed, radius, height, agility, tail, hover } = style;
  fish.rig.position.set(...position);
  const velocity=V(...initialTarget).sub(fish.rig.position).normalize().multiplyScalar(speed*.90);
  fish.motion={
    zone,speed,radius,height,agility,tail,hover,velocity,target:V(...initialTarget),
    timeToWander:5.2+fish.rng()*4, timeToSwim:0, phase:fish.swim.phase.value, bank:0, idleFor:0,
    facing:velocity.clone().normalize(), next:V(), preferred:V(), trial:V(), firstHeading:true
  };
  return fish;
}
function newSwimTarget(fish) {
  const m=fish.motion, p=fish.rig.position, rng=fish.rng;
  const margin=clearSegment(p,p,m.radius+.06,m.height+.06)?.06:0;
  let score=-Infinity, found=false;
  for(let i=0;i<22;i++){
    m.trial.set(between(-3.35,3.35,rng),between(m.zone[0],m.zone[1],rng),between(-1.25,1.20,rng));
    fishBounds(m.trial,m);
    const distance=m.trial.distanceTo(p);
    if(distance<.55 || !clearSegment(p,m.trial,m.radius+margin,m.height+margin)) continue;
    const alignment=m.preferred.copy(m.trial).sub(p).normalize().dot(m.facing);
    const rating=(alignment*.64+1)*Math.min(distance,3)*between(.5,1.2,rng);
    if(rating>score){
      m.target.copy(m.trial);
      score=rating;
      found=true;
    }
  }
  if(!found){
    for(const x of [-2.22,0,2.22]){
      for(const y of [m.zone[1],m.zone[0],4.38-m.height]){
        m.trial.set(x,y,1.85-m.radius);
        fishBounds(m.trial,m);
        if(m.trial.distanceToSquared(p)>.12 && clearSegment(p,m.trial,m.radius,m.height)) {
          m.target.copy(m.trial);
          found=true;
          break;
        }
      }
      if(found) break;
    }
  }
  if(!found){
    for(const axis of ['z','y','x']){
      for(const sign of [1,-1]){
        m.trial.copy(p);
        m.trial[axis]+=sign*.42;
        fishBounds(m.trial,m);
        if(m.trial.distanceToSquared(p)>.025 && clearSegment(p,m.trial,m.radius,m.height)){
          m.target.copy(m.trial);
          found=true;
          break;
        }
      }
      if(found)break;
    }
  }
  if(!found) m.target.copy(p);
  m.timeToWander=found?between(4.4,10.2,rng):.16;
}
function animateFishDetails(fish, time, swimSpeed, dt) {
  const {motion:m,swim}=fish;
  const effort=clamp(swimSpeed/m.speed,.05,1.44);
  m.phase+=dt*(m.tail*(.35+.69*effort));
  swim.phase.value=m.phase;
  swim.effort.value=effort;
  const p=fish.rig.position;
  currentAt(p.x,p.y,p.z,time,m.trial);
  swim.flow.value.set(m.trial.x,m.trial.z);
  for (const {pivot,side} of fish.pectorals) {
    pivot.rotation.y=side*(.22+sin(m.phase*1.92+side*.49)*(.32+.14*effort));
    pivot.rotation.x=side*(.11+cos(m.phase*1.92)*.16);
  }
  for(let i=0;i<fish.gills.length;i++){
    fish.gills[i].scale.z=1+.10*sin(time*5.8+i*.7);
    fish.gills[i].rotation.y=.026*sin(time*5.8+i*.7);
  }
  for(const {position,base,side} of fish.filaments){
    for(let i=0;i<position.count;i++){
      const t=Math.floor(i/7)/25;
      position.setXYZ(i,base[3*i]-.10*t*t*effort,
        base[3*i+1]+.030*sin(time*3.1-t*4.7)*t,
        base[3*i+2]+t*t*(.069*sin(m.phase*.64-t*4.7+side*.6)+swim.flow.value.y*.73));
    }
    position.needsUpdate=true;
  }
}
const fishHeading=V(), headingZ=V(), headingY=V(), separation=V();
const headingMatrix=new THREE.Matrix4(), goalQuaternion=new THREE.Quaternion(), bankQuaternion=new THREE.Quaternion();
const NOSE=V(1,0,0);
function updateSwimmers(all, time, dt) {
  for(const fish of all){
    const {motion:m,rig,rng}=fish, p=rig.position;
    m.timeToWander-=dt;
    const remaining=p.distanceTo(m.target);
    if(m.timeToSwim<=time && (m.timeToWander<=0 || remaining<.25)) {
      if(remaining<.28 && rng()<m.hover) m.timeToSwim=time+between(.7,2.1,rng);
      newSwimTarget(fish);
    }
    const coax=clamp(remaining*1.9,.31,1);
    const pulse=.91+.14*sin(time*(.7+m.agility*.23)+m.tail)+.09*cos(time*1.64+m.agility);
    const speed=m.speed*pulse*coax*(m.timeToSwim>time?.15:1.);
    const padding=clearSegment(p,p,m.radius+.055,m.height+.055)?.055:0;
    m.preferred.copy(m.target).sub(p).normalize().multiplyScalar(speed);
    if(padding>0) {
      for(const other of all){
        if(other===fish) continue;
        separation.copy(p).sub(other.rig.position).addScaledVector(m.velocity,.34).addScaledVector(other.motion.velocity,-.34);
        separation.y*=.78;
        const d=separation.length(), limit=(m.radius+other.motion.radius)*.93;
        if(d<limit && d>.001) m.preferred.addScaledVector(separation,(limit-d)*1.65/d);
      }
      m.preferred.y=clamp(m.preferred.y,-m.speed*.64,m.speed*.64);
    }
    m.next.copy(p).addScaledVector(m.velocity,.77);
    fishBounds(m.next,m);
    if(!clearSegment(p,m.next,m.radius+padding,m.height+padding)){
      m.timeToWander=Math.min(m.timeToWander,.18);
      m.velocity.multiplyScalar(exp(-3.1*dt));
    }
    m.velocity.lerp(m.preferred,1-exp(-m.agility*dt));
    m.next.copy(p).addScaledVector(m.velocity,dt);
    fishBounds(m.next,m);
    if(!clearSegment(p,m.next,m.radius,m.height)) {
      // At a solid face, follow the already checked route instead of carrying a sideways drift.
      newSwimTarget(fish);
      m.velocity.copy(m.target).sub(p).normalize().multiplyScalar(Math.min(.11,speed*.55));
      fishBounds(m.next.copy(p).addScaledVector(m.velocity,dt),m);
      if(!clearSegment(p,m.next,m.radius,m.height)) m.next.copy(p);
    }
    m.velocity.subVectors(m.next,p).multiplyScalar(1/dt);
    p.copy(m.next);
    const actualSpeed=m.velocity.length();
    m.idleFor=(actualSpeed<.023 && m.timeToSwim<=time)?m.idleFor+dt:0;
    if(m.idleFor>.81){
      newSwimTarget(fish);
      m.idleFor=0;
    }
    if(actualSpeed>.041) {
      fishHeading.copy(m.velocity);
      fishHeading.y=clamp(fishHeading.y,-Math.hypot(fishHeading.x,fishHeading.z)*.57,Math.hypot(fishHeading.x,fishHeading.z)*.57);
      fishHeading.normalize();
      const turn=m.facing.x*fishHeading.z-m.facing.z*fishHeading.x;
      m.bank=lerp(m.bank,clamp(turn*.32,-.24,.24),1-exp(-3*dt));
      m.facing.lerp(fishHeading,1-exp(-2.7*dt)).normalize();
    }
    headingZ.crossVectors(m.facing,UP).normalize();
    headingY.crossVectors(headingZ,m.facing);
    headingMatrix.makeBasis(m.facing,headingY,headingZ);
    goalQuaternion.setFromRotationMatrix(headingMatrix);
    goalQuaternion.multiply(bankQuaternion.setFromAxisAngle(NOSE,m.bank));
    rig.quaternion.slerp(goalQuaternion,m.firstHeading?1:1-exp(-3.8*dt));
    m.firstHeading=false;
    animateFishDetails(fish,time,actualSpeed,dt);
  }
}

    const eyeEnd=V(side*.123,.172,.160);
    rod(body,eyestalk,eyeEnd,.015,carapace);
    oval(body,eyeBlack,eyeEnd.x,eyeEnd.y,eyeEnd.z,.033,.027,.025,smallSphere);
    oval(body,eyeGlint,eyeEnd.x+.006,eyeEnd.y+.010,eyeEnd.z+.020,.006,.005,.004,smallSphere);
    oval(body,jointsMat,side*.038,-.005,.173,.043,.031,.015,smallSphere);
    for(let i=0;i<3;i++){
      oval(body,tips,side*(.035+i*.022),.014+i*.014,.172,.010,.009,.012,smallSphere);
    }
    tube(body,[V(side*.049,.009,.17),V(side*.055,.003,.202),V(side*.031,-.013,.219)],.006,tips,8,4);
  }
  const pincers=[];
  for(const side of [-1,1]){
    const wrist=group('Articulated claw arm',crab,side*.137,.034,.105);
    const s=side*(side<0?.93:1.02);
    const elbow=V(s*.104,.001,.053), hand=V(s*.159,.021,.127);
    rod(wrist,V(),elbow,.040,legsMat);
    oval(wrist,jointsMat,elbow.x,elbow.y,elbow.z,.042,.043,.044,smallSphere);
    rod(wrist,elbow,hand,.044,carapace);
    const palm=group('Claw palm',wrist,...hand.toArray());
    palm.rotation.y=side*.29;
    oval(palm,carapace,0,.006,.026,.072,.058,.072);
    const fixed=[V(side*.038,.009,.058),V(side*.053,.021,.112),V(side*.043,.021,.149),V(side*.009,.008,.172)];
    tube(palm,fixed,.022,carapace,13,9);
    oval(palm,tips,fixed[3].x,fixed[3].y,fixed[3].z,.020,.016,.023,smallSphere);
    const jaw=group('Hinged movable pincer',palm,-side*.028,-.013,.050);
    tube(jaw,[V(),V(-side*.029,-.004,.043),V(-side*.016,-.005,.090),V(side*.025,.002,.107)],.019,legsMat,12,8);
    oval(jaw,tips,side*.025,.002,.107,.017,.013,.018,smallSphere);
    for(let i=0;i<3;i++) oval(jaw,tips,side*(-.018+i*.012),.014,.043+i*.017,.009,.010,.009,smallSphere);
    pincers.push({wrist,jaw,side});
  }
  const legs=[];
  for(const side of [-1,1]) for(let i=0;i<4;i++){
    const leg=group('Walking leg '+(side<0?i+1:i+5),crab);
    const root=V(side*(.171+.017*sin(i*1.4)),-.016,.079-i*.067);
    const rest=V(side*(.362+.055*sin((i+.5)*PI/4)),0,.165-i*.117);
    const segments=[mesh(leg,unitCylinder,legsMat),mesh(leg,unitCylinder,carapace),mesh(leg,unitCylinder,tips)];
    const joints=[oval(leg,jointsMat,0,0,0,.028,.026,.026,smallSphere),
      oval(leg,jointsMat,0,0,0,.021,.022,.022,smallSphere)];
    const toe=oval(leg,jointsMat,0,0,0,.016,.014,.021,smallSphere);
    legs.push({root,rest,segments,joints,toe,side,phase:(i+(side>0?1:0))%2*.5,
      anchor:V(),origin:V(),destination:V(),inSwing:false});
  }
  grounded(crab);
  const trail=new THREE.CatmullRomCurve3([
    V(.32,0,1.31),V(1.49,0,1.28),V(2.50,0,1.09),V(2.66,0,.81),
    V(1.62,0,.73),V(.41,0,.77),V(-.65,0,.53),V(-1.55,0,.49),
    V(-2.55,0,.96),V(-2.72,0,1.18),V(-1.85,0,.78),V(-.79,0,.81)
  ],true,'catmullrom',.27);
  const trailLength=trail.getLength();
  const candidate=V(), tangent=V(), footWorld=V(), footLocal=V(), elbow=V(), ankle=V(), predicted=V(), restRotated=V();
  const inverse=new THREE.Quaternion();
  let journey=0, stride=0, yaw=0, initialized=false, waitRemaining=0, untilStop=5.5, gait=0;
  function update(time,dt,snail) {
    let moving=waitRemaining<=0;
    if(moving){
      untilStop-=dt;
      if(untilStop<0){
        waitRemaining=between(.9,2.4);
        untilStop=between(5.6,12.6);
        moving=false;
      }
    } else waitRemaining-=dt;
    const speed=.292+.061*sin(time*.69);
    const next=(journey+(moving?speed*dt:0)/trailLength)%1;
    trail.getPointAt(next,candidate);
    if(snail && Math.hypot(candidate.x-snail.x,candidate.z-snail.z)<.48) moving=false;
    if(moving) journey=next;
    trail.getPointAt(journey,candidate);
    trail.getTangentAt(journey,tangent);
    const targetYaw=atan2(-tangent.z,tangent.x);
    let change=atan2(sin(targetYaw-yaw),cos(targetYaw-yaw));
    if(abs(change)>PI/2) change-=Math.sign(change)*PI;
    yaw+=change*(1-exp(-3*dt));
    if(!initialized){ crab.position.copy(candidate); yaw=targetYaw; }
    crab.position.x=candidate.x;
    crab.position.z=candidate.z;
    gait=lerp(gait,moving?1:0,1-exp(-7*dt));
    stride=(stride+dt*(.7+gait*1.98))%1;
    const level=terrainHeight(candidate.x,candidate.z)+.127+.012*sin(stride*TAU*2)*gait;
    crab.position.y=initialized?lerp(crab.position.y,level,1-exp(-10*dt)):level;
    crab.rotation.y=yaw;
    crab.updateMatrixWorld();
    inverse.copy(crab.quaternion).invert();
    for(const leg of legs){
      const phase=(stride+leg.phase)%1;
      const swing=phase>.61;
      restRotated.copy(leg.rest).applyQuaternion(crab.quaternion).add(crab.position);
      restRotated.y=terrainHeight(restRotated.x,restRotated.z)+.012;
      if(!initialized) leg.anchor.copy(restRotated);
      if(swing && !leg.inSwing){
        leg.origin.copy(leg.anchor);
        predicted.copy(restRotated).addScaledVector(tangent,gait*.097);
        predicted.x=clamp(predicted.x,-3.88,3.88);
        predicted.z=clamp(predicted.z,-1.88,1.88);
        predicted.y=terrainHeight(predicted.x,predicted.z)+.012;
        leg.destination.copy(predicted);
      }
      if(!swing && leg.inSwing) leg.anchor.copy(leg.destination);
      leg.inSwing=swing;
      if(swing){
        const u=clamp((phase-.61)/.39,0,1);
        footWorld.copy(leg.origin).lerp(leg.destination,u*u*(3-2*u));
        const travel=Math.min(1,leg.origin.distanceTo(leg.destination)*34);
        footWorld.y=Math.max(footWorld.y,terrainHeight(footWorld.x,footWorld.z)+.011)+.052*sin(PI*u)*travel;
      } else footWorld.copy(leg.anchor);
      footLocal.copy(footWorld).sub(crab.position).applyQuaternion(inverse);
      elbow.copy(leg.root).lerp(footLocal,.40);
      elbow.x+=leg.side*.019; elbow.y+=.111; elbow.z+=.027;
      ankle.copy(leg.root).lerp(footLocal,.76);
      ankle.x+=leg.side*.009; ankle.y+=.048; ankle.z-=.006;
      aimRod(leg.segments[0],leg.root,elbow,.024);
      aimRod(leg.segments[1],elbow,ankle,.019);
      aimRod(leg.segments[2],ankle,footLocal,.0135);
      leg.joints[0].position.copy(elbow);
      leg.joints[1].position.copy(ankle);
      leg.toe.position.copy(footLocal);
    }
    for(const {wrist,jaw,side} of pincers){
      const gesture=(1-gait)*Math.pow(.5+.5*sin(time*2.9+side*1.8),5);
      wrist.rotation.x=-gesture*.40+sin(stride*TAU+side)*.047*gait;
      wrist.rotation.y=side*(.033+sin(time*2.05+side)*.074);
      jaw.rotation.y=-side*(.13+gesture*.61+.06*sin(time*3.6+side));
    }
    initialized=true;
  }
  return {crab,update};
}

// Two logarithmic shells, their muscular feet, and independent crawler paths.
function snailShell(snail, glass) {
  const positions=[], colors=[], indices=[];
  const sections=165, round=24;
  const base=RGB(glass?'#b8ae66':'#bd7337');
  const ridge=RGB(glass?'#5f6036':'#78391e');
  const lip=RGB(glass?'#dbc58d':'#e0a06a');
  const tint=base.clone();
  const point=V(),normal=V(),tangent=V();
  function shellAxis(t,out) {
    const a=-.86+t*TAU*2.77;
    const radius=.116*exp(-t*2.65);
    return out.set(-.038+cos(a)*radius,.139+sin(a)*radius,.058-.065*t+.016*sin(t*6.1));
  }
  const previous=V(), next=V();
  for(let j=0;j<=sections;j++){
    const t=j/sections;
    shellAxis(t,point);
    tangent.subVectors(shellAxis(t+.0011,next),shellAxis(t-.0011,previous)).normalize();
    normal.set(tangent.y,-tangent.x,0).normalize();
    const radius=(.076*exp(-t*3.1)+.002)*(1-.98*smoothstep(t,.922,1.));
    for(let k=0;k<=round;k++){
      const s=k/round,a=s*TAU;
      const growth=.5+.5*cos(t*TAU*(glass?18:25)+.53*sin(a*2.));
      const rib=1+.024*growth;
      positions.push(point.x+normal.x*cos(a)*radius*rib,point.y+normal.y*cos(a)*radius*rib,
        point.z+sin(a)*radius*rib*1.10);
      const pigment=glass?Math.pow(.5+.5*sin(a*4.0+t*13.4+sin(t*28.)*.6),5)*.86:.44*growth;
      tint.copy(base).lerp(ridge,pigment).lerp(lip,smoothstep(.62,.95,sin(a))*.30+(1-smoothstep(0,.034,t))*.35);
      tint.multiplyScalar(.88+.18*cos(a+t*21)**2);
      colors.push(tint.r,tint.g,tint.b);
      if(k&&j){
        const cur=j*(round+1)+k,above=cur-round-1;
        indices.push(above-1,above,cur-1,above,cur,cur-1);
      }
    }
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const material=surfaceMaterial('#fff',{vertexColors:true,roughness:.40,coat:.47,grain:.24,frequency:74,
    caustics:.39,double:true});
  return mesh(snail,geometry,material);
}
function createSnail(parent,name,glass) {
  const snail=group(name,parent);
  const flesh=surfaceMaterial(glass?'#888164':'#94705a',{roughness:.41,coat:.49,grain:.31,frequency:63,caustics:.31});
  const footColor=surfaceMaterial(glass?'#bbab83':'#b38a74',{roughness:.5,coat:.40,grain:.29,frequency:70,caustics:.27});
  const gripping=oval(snail,footColor,.006,.016,0,.219,.016,.087);
  const softBody=oval(snail,flesh,.016,.041,0,.187,.041,.071);
  const neck=group('Inquiring snail head',snail,.152,.053,0);
  oval(neck,flesh,.006,.012,0,.072,.049,.052);
  const shell=snailShell(snail,glass);
  shell.name='Modeled spiral shell and growth bands';
  const aperture=oval(snail,flesh,.047,.061,.056,.066,.060,.071,smallSphere);
  aperture.rotation.z=-.30;
  const antennae=[];
  for(const side of [-1,1]){
    const root=V(.028,.031,side*.035);
    const first=mesh(neck,unitCylinder,flesh), second=mesh(neck,unitCylinder,flesh);
    const eye=oval(neck,eyeBlack,0,0,0,.010,.010,.010,smallSphere);
    antennae.push({root,first,second,eye,side});
    rod(neck,V(.042,.005,side*.030),V(.081,-.004,side*.053),.005,flesh);
  }
  const middle=V(), tip=V();
  function animate(time){
    const contraction=sin(time*3.3);
    gripping.scale.x=.219+.009*contraction;
    gripping.scale.z=.087-.0026*contraction;
    softBody.scale.x=.187+.006*contraction;
    neck.rotation.z=.072*sin(time*1.4);
    neck.rotation.y=.10*cos(time*1.25);
    shell.rotation.x=.046*sin(time*2.2);
    shell.position.y=.004*cos(time*3.3);
    for(const {root,first,second,eye,side} of antennae){
      middle.set(.070+.019*sin(time*1.8+side),.080+.009*cos(time*1.6+side),side*.064);
      tip.set(.100+.020*sin(time*1.7+side),.132+.023*cos(time*1.5+side),side*(.084+.018*cos(time*1.4+side)));
      aimRod(first,root,middle,.008);
      aimRod(second,middle,tip,.0053);
      eye.position.copy(tip);
    }
  }
  grounded(snail);
  return {snail,animate};
}
function createBottomSnail(parent) {
  const {snail,animate}=createSnail(parent,'Amber snail on the gravel',false);
  const trail=new THREE.CatmullRomCurve3([
    V(-1.86,0,1.51), V(-1.52,0,1.31), V(-1.19,0,1.29), V(-.88,0,1.55),
    V(-.97,0,1.68), V(-1.51,0,1.71), V(-1.94,0,1.69), V(-2.16,0,1.57)
  ],true,'centripetal');
  const length=trail.getLength();
  const now=V(), direction=V(), ahead=V(), behind=V();
  let journey=.079, gaitTime=0;
  function update(time,dt,crabPosition) {
    const next=(journey+(.040+.006*sin(time*.38))*dt/length)%1;
    trail.getPointAt(next,now);
    if(!crabPosition || Math.hypot(now.x-crabPosition.x,now.z-crabPosition.z)>.46){
      journey=next; gaitTime+=dt;
    } else trail.getPointAt(journey,now);
    trail.getTangentAt(journey,direction);
    ahead.copy(now).addScaledVector(direction,.10);
    behind.copy(now).addScaledVector(direction,-.10);
    const tilt=atan2(terrainHeight(ahead.x,ahead.z)-terrainHeight(behind.x,behind.z),.20);
    snail.position.set(now.x,terrainHeight(now.x,now.z)+.002,now.z);
    snail.rotation.set(0,atan2(-direction.z,direction.x),clamp(tilt,-.39,.39),'YXZ');
    animate(time+gaitTime*.34);
  }
  return {snail,update};
}
function createGlassSnail(parent) {
  const {snail,animate}=createSnail(parent,'Olive snail on the inside of the front pane',true);
  snail.scale.setScalar(.91);
  const axis=V(), up=V(0,0,-1), third=V();
  const basis=new THREE.Matrix4(), targetRotation=new THREE.Quaternion();
  function update(time,dt) {
    const step=time*.079;
    snail.position.set(2.56+.27*sin(step),1.06+.19*sin(step*.76+.4),1.954);
    axis.set(.27*cos(step),.19*.76*cos(step*.76+.4),0).normalize();
    third.crossVectors(axis,up);
    basis.makeBasis(axis,up,third);
    snail.quaternion.slerp(targetRotation.setFromRotationMatrix(basis),time===0?1:1-exp(-8.9*dt));
    animate(time+.87);
  }
  return {snail,update};
}

// A sparse, fixed pool of points in the same current field as the plants and fins.
function createSuspendedParticles(parent) {
  const count=77, rng=randomSource(1917);
  const positions=new Float32Array(count*3), seeds=new Float32Array(count);
  for(let i=0;i<count;i++){
    positions[i*3]=between(-3.9,3.9,rng);
    positions[i*3+1]=between(.26,4.38,rng);
    positions[i*3+2]=between(-1.88,1.88,rng);
    seeds[i]=rng();
  }
  const geo=new THREE.BufferGeometry();
  const coords=new THREE.BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position',coords);
  geo.setAttribute('seed',new THREE.BufferAttribute(seeds,1));
  const material=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,uniforms:{clock:simTime,scale:opticalSize},
    vertexShader:`attribute float seed; uniform float clock; uniform vec2 scale;
      varying float glow; void main(){
        vec4 p=modelViewMatrix*vec4(position,1.);
        glow=(.5+.5*sin(seed*287.+clock*.76))*(.34+.64*seed);
        gl_Position=projectionMatrix*p;
        gl_PointSize=clamp(scale.y*(.012+.019*seed)/max(1.5,-p.z),1.,3.8);
      }`,
    fragmentShader:`varying float glow; void main(){
      float r=length(gl_PointCoord-.5)*2.;
      gl_FragColor=vec4(.29,.57,.63,(1.-smoothstep(.05,1.,r))*.39*glow);
    }`
  });
  const motes=new THREE.Points(geo,material);
  motes.name='Suspended particles';
  motes.frustumCulled=false;
  motes.renderOrder=3;
  parent.add(motes);
  const flow=V();
  return (time,dt)=>{
    for(let i=0;i<count;i++){
      const a=i*3,x=positions[a],y=positions[a+1],z=positions[a+2];
      currentAt(x,y,z,time,flow);
      positions[a]=x+flow.x*dt*.7;
      positions[a+1]=y+(flow.y-.012)*dt*.82;
      positions[a+2]=z+flow.z*dt*.7;
      if(positions[a]<-3.91)positions[a]=3.89;
      if(positions[a]>3.91)positions[a]=-3.89;
      if(positions[a+1]<.25)positions[a+1]=4.32;
      if(positions[a+1]>4.48)positions[a+1]=.29;
      if(positions[a+2]<-1.91)positions[a+2]=1.88;
      if(positions[a+2]>1.91)positions[a+2]=-1.88;
    }
    coords.needsUpdate=true;
  };
}

const interior=group('Aquarium interior',bodyScene);
createFilter(interior);
const updateBubbles=createBubbles(bubbleScene);
createPebbles(interior);
createCastle(interior);
createVallisneria(interior,-2.83,-1.11);
createAnubias(interior,-2.72,.30);
createJavaFern(interior,2.95,.64);
createCabomba(interior,1.56,-1.23);

const fish=[
  startSwimmer(createGuppy(interior),{ position:[-1.94,3.44,.29],initialTarget:[1.2,3.69,.46],
    zone:[2.64,4.06],speed:.47,radius:.68,height:.33,agility:1.74,tail:13.5,hover:.39 }),
  startSwimmer(createClownfish(interior),{ position:[.39,2.31,1.11],initialTarget:[-2.40,2.03,1.04],
    zone:[1.09,3.13],speed:.40,radius:.70,height:.40,agility:1.44,tail:10.4,hover:.19 }),
  startSwimmer(createAngelfish(interior),{ position:[-1.13,2.04,1.06],initialTarget:[.75,2.54,1.14],
    zone:[1.48,3.45],speed:.25,radius:.73,height:.88,agility:1.08,tail:6.6,hover:.59 }),
  startSwimmer(createBetta(interior),{ position:[2.42,3.29,.33],initialTarget:[-.05,3.08,.39],
    zone:[2.20,3.92],speed:.29,radius:.94,height:.56,agility:1.30,tail:7.7,hover:.68 })
];
const walkingCrab=createCrab(interior);
const bottomSnail=createBottomSnail(interior);
const glassSnail=createGlassSnail(interior);
const updateParticles=createSuspendedParticles(interior);

function stepSimulation(time,dt) {
  simTime.value=time;
  updateBubbles(time,dt);
  for(const sway of plantSystems) sway(time);
  updateSwimmers(fish,time,dt);
  walkingCrab.update(time,dt,bottomSnail.snail.position);
  bottomSnail.update(time,dt,walkingCrab.crab.position);
  glassSnail.update(time,dt);
  updateParticles(time,dt);
}

// Prime the display with the plume already in motion, and hold the composed opening view.
for(let frame=-177;frame<=0;frame++) updateBubbles(frame/60,1/60);
stepSimulation(0,1/120);
glassSnail.update(0,0);
resize();
resetView();
renderAquarium();
document.getElementById('status').hidden=true;
document.querySelector('.controls').hidden=false;

const pause=document.getElementById('pause');
const pauseIcon=document.getElementById('pause-icon');
const playIcon=document.getElementById('play-icon');
const pauseLabel=pause.querySelector('span');
let paused=false;
let lastFrame=0, time=0, nextShadow=0;
let slowFrames=0, qualityReduced=false;
controls.addEventListener('change',()=>{ viewDirty=true; });
document.getElementById('reset').addEventListener('click',()=>{ resetView(); viewDirty=true; });
pause.addEventListener('click',()=>{
  paused=!paused;
  pause.setAttribute('aria-pressed',String(paused));
  pauseLabel.textContent=paused?'Resume':'Pause';
  pauseIcon.toggleAttribute('hidden',paused);
  playIcon.toggleAttribute('hidden',!paused);
  viewDirty=true;
});
addEventListener('resize',()=>{
  const previousHome=homeDistance;
  resize();
  camera.position.sub(controls.target).multiplyScalar(homeDistance/previousHome).add(controls.target);
  updateCamera(0);
});
document.addEventListener('visibilitychange',()=>{ lastFrame=0; });

renderer.setAnimationLoop(now=>{
  const frameDuration=lastFrame ? (now-lastFrame)/1000 : 1/60;
  lastFrame=now;
  const dt=clamp(frameDuration,.001,.085);
  updateCamera(dt);
  if(!paused){
    const steps=Math.ceil(dt/.022);
    for(let i=0;i<steps;i++){
      time+=dt/steps;
      stepSimulation(time,dt/steps);
    }
    if(time>=nextShadow){
      shadowLight.shadow.needsUpdate=true;
      nextShadow=time+.075;
    }
    if(!qualityReduced && time>2.0){
      slowFrames=clamp(slowFrames+(frameDuration>.032?1:-2),0,70);
      if(slowFrames>=60){
        qualityReduced=true;
        capture.samples=0;
        opticalResolution=.76;
        resize();
        updateCamera(0);
      }
    }
  }
  if(!paused || viewDirty){
    renderAquarium();
    viewDirty=false;
  }
});
