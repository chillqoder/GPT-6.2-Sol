<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101720">
  <title>Orc Shaman — Spirits of the Storm</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --ivory: #f2e4c9;
      --gold: #c8a574;
      --gutter: clamp(22px, 4.15vw, 70px);
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #101720; color: var(--ivory); }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff2d5; outline-offset: 5px; }
    svg { display: block; }
    #stage, #vignette, #flash, #damage { position: fixed; inset: 0; }
    #stage { overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #stage canvas:active { cursor: grabbing; }

    #vignette {
      pointer-events: none;
      background:
        linear-gradient(180deg, #0a0e18a6, transparent 29%, transparent 56%, #0a101699 84%, #080c13e0),
        radial-gradient(ellipse at 53% 43%, transparent 39%, #080b137d 100%);
    }

    .frame {
      pointer-events: none;
      position: fixed;
      inset: 16px;
      border: 1px solid #c3a57330;
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-block-start: 1px solid #cfab74a0;
      border-inline-start: 1px solid #cfab74a0;
    }

    .corner:nth-child(1) { top: -1px; left: -1px; }
    .corner:nth-child(2) { top: -1px; right: -1px; transform: rotate(90deg); }
    .corner:nth-child(3) { bottom: -1px; right: -1px; transform: rotate(180deg); }
    .corner:nth-child(4) { bottom: -1px; left: -1px; transform: rotate(270deg); }

    .heading {
      pointer-events: none;
      position: fixed;
      left: var(--gutter);
      top: clamp(30px, 5.6vh, 64px);
      text-shadow: 0 2px 14px #080b13, 0 1px 3px #080b13;
    }

    h1 {
      margin: 0;
      color: var(--ivory);
      font: normal clamp(37px, 4.4vw, 72px)/.95 Georgia, serif;
      letter-spacing: -.06em;
    }

    .subtitle { display: block; margin-top: 10px; color: #d7b47e; font: 600 11px/1.3 system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; }
    .title-rule { display: flex; align-items: center; gap: 5px; width: 166px; margin: 17px 0 11px; }
    .title-rule::before, .title-rule::after { content: ""; height: 1px; background: linear-gradient(90deg, #bf9d64bc, #bf9d6414); }
    .title-rule::before { width: 14px; }
    .title-rule::after { flex: 1; }
    .diamond { width: 5px; height: 5px; border: 1px solid var(--gold); transform: rotate(45deg); }
    .hint { margin: 0; font-size: 11px; letter-spacing: .055em; color: #d5d6d2; }
    .hint.touch { display: none; }

    .sound {
      position: fixed;
      top: clamp(30px, 5.6vh, 64px);
      right: var(--gutter);
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: #111621c4;
      border: 1px solid #c8a57470;
      border-radius: 3px;
      color: #ddc399;
    }

    .sound:hover { background: #2b2a31; border-color: #e9c593; }
    .sound .muted, .sound[aria-pressed="true"] .audible { display: none; }
    .sound[aria-pressed="true"] .muted { display: block; }

    .hud {
      position: fixed;
      left: 50%;
      bottom: max(32px, calc(env(safe-area-inset-bottom) + 22px));
      width: min(326px, calc(100% - 48px));
      transform: translateX(-50%);
    }

    .mana-label { display: flex; align-items: center; gap: 7px; margin: 0 0 7px; color: #cbe8f9; font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .22em; }
    .mana-label .diamond { border-color: #8bdaff; margin-left: 2px; background: #56badcc0; box-shadow: 0 0 9px #57d1f99e; }
    #mana-value { margin-left: auto; color: #c1d0dc; font-variant-numeric: tabular-nums; letter-spacing: .1em; }
    .mana-track { position: relative; height: 8px; padding: 1px; border: 1px solid #7598af89; background: #0d1623; box-shadow: 0 0 14px #3887ac22; }
    .mana-fill { height: 100%; background: linear-gradient(90deg, #255f9b, #3eaccc 74%, #a0e9f1); transform-origin: left; box-shadow: 0 0 9px #43b3d294; }
    .mana-track::after { position: absolute; inset: 1px; content: ""; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), #06182585 calc(25% - 1px) 25%); pointer-events: none; }

    .spellbar { margin-top: 11px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .spell {
      --spell: #9bdaff;
      --tint: #16344b;
      --sweep: 0deg;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      height: 91px;
      overflow: hidden;
      padding: 6px 3px 8px;
      background: radial-gradient(ellipse at 50% 20%, var(--tint), #101622 75%);
      border: 1px solid color-mix(in srgb, var(--spell) 62%, #17202a);
      border-radius: 4px;
      box-shadow: 0 3px 11px #070a10af, inset 0 0 15px color-mix(in srgb, var(--spell) 13%, transparent);
      transition: transform 120ms, box-shadow 160ms, border-color 160ms;
    }

    .spell::before { position: absolute; inset: 3px; z-index: -1; border: 1px solid color-mix(in srgb, var(--spell) 21%, transparent); border-radius: 2px; content: ""; pointer-events: none; }
    .spell[data-spell="fireball"] { --spell: #ffad75; --tint: #452921; }
    .spell[data-spell="earthquake"] { --spell: #a7df8b; --tint: #253d2f; }
    .spell:hover, .spell.casting { border-color: var(--spell); box-shadow: 0 0 19px color-mix(in srgb, var(--spell) 39%, transparent), inset 0 0 20px color-mix(in srgb, var(--spell) 21%, transparent); }
    .spell:active { transform: scale(.95); }
    .spell .icon { width: 40px; height: 39px; color: var(--spell); filter: drop-shadow(0 0 9px color-mix(in srgb, var(--spell) 65%, transparent)); }
    .spell-name { display: grid; place-items: center; width: 100%; min-height: 16px; color: #fff4dc; text-align: center; text-transform: uppercase; text-wrap: balance; letter-spacing: .042em; font-size: 8.5px; font-weight: 700; line-height: 1.1; }
    .hotkey, .cost { position: absolute; z-index: 2; top: 7px; font-size: 9px; line-height: 15px; }
    .hotkey { left: 7px; min-width: 15px; border: 1px solid #ffffff28; border-radius: 2px; background: #090d16a6; font-family: inherit; color: #e1e5e6; }
    .cost { right: 7px; color: #b6dcef; }
    .cooldown {
      display: grid;
      place-items: center;
      position: absolute;
      inset: 0;
      background: conic-gradient(#040912db var(--sweep), #090d164b 0);
      color: #fff1d5;
      text-shadow: 0 1px 5px #000, 0 1px 2px #000;
      font-size: 23px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      pointer-events: none;
    }

    .spell.cooling .cooldown { opacity: 1; }
    .spell.casting .cooldown { background: conic-gradient(#0409128c var(--sweep), #090d1626 0); }
    .spell.denied { animation: reject 320ms ease-out; }
    @keyframes reject {
      20%, 60% { transform: translateX(-4px); background: #5d1d2b; border-color: #ff7e78; }
      40%, 80% { transform: translateX(4px); }
    }

    #status { position: absolute; width: 100%; bottom: 100%; margin: 0 0 15px; color: #f4bdab; font-size: 11px; text-align: center; text-shadow: 0 1px 6px #000; }
    #flash { pointer-events: none; opacity: 0; background: #b6ddff; mix-blend-mode: screen; }
    #damage { pointer-events: none; overflow: hidden; }
    .damage-number { position: absolute; font: bold 29px Georgia, serif; text-shadow: 0 2px 4px #08101a, 0 0 12px currentColor; }
    .target-label {
      position: absolute;
      display: grid;
      justify-items: center;
      gap: 4px;
      color: #e2ceaa;
      font-size: 8px;
      font-weight: 650;
      letter-spacing: .23em;
      text-transform: uppercase;
      text-shadow: 0 1px 5px #060b11;
      white-space: nowrap;
    }

    .target-label .diamond { width: 4px; height: 4px; }
    .loading {
      position: fixed;
      inset: 37% 24px auto;
      text-align: center;
      color: #eddbb8;
      font: 19px Georgia, serif;
      text-shadow: 0 2px 10px #05080e;
    }

    [hidden] { display: none !important; }
    @media (pointer: coarse) {
      .hint.desktop { display: none; }
      .hint.touch { display: block; }
    }
    @media (max-width: 560px) {
      .frame { inset: 11px; }
      .subtitle { letter-spacing: .24em; }
      .heading { top: max(28px, env(safe-area-inset-top)); }
      .title-rule { margin-top: 12px; }
      .hud { bottom: max(25px, calc(env(safe-area-inset-bottom) + 18px)); }
      .spell { height: 84px; }
    }
    @media (max-height: 490px) {
      .heading, .sound { top: 23px; }
      h1 { font-size: 32px; }
      .title-rule { margin: 9px 0 6px; }
      .hud { bottom: 20px; width: 280px; }
      .spell { height: 67px; }
      .spell .icon { height: 29px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spell { transition: none; }
      .spell.denied { animation: none; border-color: #ff7e78; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage" aria-label="Interactive 3D ritual clearing"></main>
  <div id="vignette" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"><i class="corner"></i><i class="corner"></i><i class="corner"></i><i class="corner"></i></div>
  <div id="flash" aria-hidden="true"></div>
  <div id="damage" aria-hidden="true">
    <div class="target-label" id="target-label" hidden>Training dummy<i class="diamond"></i></div>
  </div>

  <header class="heading">
    <h1>Orc Shaman<span class="subtitle"><span class="title-dash" aria-hidden="true">— </span>Spirits of the Storm</span></h1>
    <div class="title-rule" aria-hidden="true"><i class="diamond"></i></div>
    <p class="hint desktop">Drag to rotate · Scroll to zoom · 1/2/3 to cast</p>
    <p class="hint touch">Drag to rotate · Pinch to zoom · Tap to cast</p>
  </header>

  <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute sound" disabled>
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9h4l5-4v14l-5-4H3z"/>
      <path class="audible" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
      <path class="muted" d="m16 10 5 5m0-5-5 5"/>
    </svg>
  </button>

  <p class="loading" id="loading" role="status">Entering the clearing…</p>

  <section class="hud" aria-label="Spell controls">
    <p id="status" role="status"></p>
    <div class="mana-label" aria-hidden="true"><i class="diamond"></i>Mana<span id="mana-value">100 / 100</span></div>
    <div id="mana" class="mana-track" role="meter" aria-label="Mana" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div class="mana-fill" id="mana-fill"></div>
    </div>
    <div class="spellbar">
      <button type="button" class="spell" data-spell="lightning" aria-label="Chain Lightning" aria-keyshortcuts="1 Q" disabled>
        <kbd class="hotkey" aria-hidden="true">1</kbd><span class="cost" aria-hidden="true"></span>
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="m27 4-17 23h12l-3 17 19-25H26z" fill="currentColor"/>
          <path d="m11 9-3 5m30 17 3-4M8 34l-3 3M38 8l3-3" fill="none" stroke="currentColor" stroke-opacity=".62" stroke-width="1.6" stroke-linecap="round"/>
          <path d="m27 4-10 20h9l-7 20 19-25H26z" fill="#fff" opacity=".22"/>
        </svg>
        <span class="spell-name">Chain Lightning</span><span class="cooldown" aria-hidden="true"></span>
      </button>
      <button type="button" class="spell" data-spell="fireball" aria-label="Fireball" aria-keyshortcuts="2 W" disabled>
        <kbd class="hotkey" aria-hidden="true">2</kbd><span class="cost" aria-hidden="true"></span>
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M25 3c4 10-7 12-4 22-5-2-7-6-6-10-6 6-8 11-7 16 1 9 8 13 16 13s16-6 16-14c0-7-4-12-7-16 1 7-3 8-4 8 1-8-1-15-4-19Z" fill="currentColor"/>
          <path d="M24 42c-5 0-8-3-8-7 0-3 2-5 4-7-1 4 2 5 3 5 2-4 5-7 5-11 4 4 6 8 6 12 0 5-4 8-10 8Z" fill="#ffeed2"/>
        </svg>
        <span class="spell-name">Fireball</span><span class="cooldown" aria-hidden="true"></span>
      </button>
      <button type="button" class="spell" data-spell="earthquake" aria-label="Earthquake Totem" aria-keyshortcuts="3 E" disabled>
        <kbd class="hotkey" aria-hidden="true">3</kbd><span class="cost" aria-hidden="true"></span>
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="m3 20 8-8 8 2 5-9 8 9 7-2 6 8-10 3-4 16-7 5-8-5-3-16z" fill="currentColor"/>
          <path d="M15 21h7m5 0h7m-10 2-3 8h6m-9 4h12" fill="none" stroke="#20332b" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="m5 20 9-2m20 0 9 2" stroke="#20332b" stroke-width="1.5"/>
        </svg>
        <span class="spell-name">Earthquake Totem</span><span class="cooldown" aria-hidden="true"></span>
      </button>
    </div>
  </section>

  <script type="module">
    const loading = document.querySelector('#loading');
    try {
      const [THREE, { OrbitControls }] = await Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js')
      ]);
      start(THREE, OrbitControls);
    } catch (error) {
      loading.textContent = 'The 3D scene could not load. Check your connection and WebGL support, then reload.';
      console.error(error);
    }

    function start(THREE, OrbitControls) {
      // Renderer, timing, and shared geometry.
      const stage = document.querySelector('#stage');
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      stage.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#121923');
      scene.fog = new THREE.FogExp2('#273b50', .052);
      const camera = new THREE.PerspectiveCamera(37, 1, .09, 95);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = .08;
      controls.enablePan = false;
      controls.minPolarAngle = .27;
      controls.maxPolarAngle = Math.PI / 2 - .06;
      controls.minDistance = 4.3;
      controls.maxDistance = 21;

      const clock = new THREE.Clock(false);
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
      const up = V(0, 1, 0);
      const down = V(0, -1, 0);
      const clamp = (x, min = 0, max = 1) => Math.min(max, Math.max(min, x));
      const lerp = THREE.MathUtils.lerp;
      const tau = Math.PI * 2;
      const cubeIn = x => x ** 3;
      const cubeOut = x => 1 - (1 - x) ** 3;
      const cubeInOut = x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
      const backOut = x => 1 + 2.15 * (x - 1) ** 3 + 1.15 * (x - 1) ** 2;
      const range = (min, max) => lerp(min, max, Math.random());
      let seed = 927;
      const terrainRandom = (min, max) => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return lerp(min, max, seed / 4294967296);
      };

      const SPELLS = {
        lightning: { name: 'Chain Lightning', cost: 20, cooldown: 2, color: '#5ab4ff', duration: 1.1, release: .45, damage: 42 },
        fireball: { name: 'Fireball', cost: 30, cooldown: 3, color: '#ff7a1a', duration: 1.2, release: .5, damage: 68 },
        earthquake: { name: 'Earthquake Totem', cost: 45, cooldown: 5, color: '#84f96a', duration: 1.6, release: .6, damage: 96 }
      };

      const geo = {
        box: new THREE.BoxGeometry(1, 1, 1),
        sphere: new THREE.SphereGeometry(1, 12, 8),
        ico: new THREE.IcosahedronGeometry(1, 0),
        roundRock: new THREE.IcosahedronGeometry(1, 1),
        dodeca: new THREE.DodecahedronGeometry(1, 0),
        cylinder: new THREE.CylinderGeometry(1, 1, 1, 10),
        cone: new THREE.ConeGeometry(1, 1, 7),
        crystal: new THREE.OctahedronGeometry(1),
        torus: new THREE.TorusGeometry(1, .105, 6, 28)
      };
      const material = (color, options = {}) => new THREE.MeshStandardMaterial({
        color, roughness: .86, flatShading: true, ...options
      });
      const glowMaterial = (color, opacity = 1) => new THREE.MeshBasicMaterial({
        color, opacity, transparent: true, blending: THREE.AdditiveBlending,
        depthWrite: false, toneMapped: false, side: THREE.DoubleSide
      });
      const skin = material('#4a7c3a');
      const skinLight = material('#6f9850');
      const skinShade = material('#355534');
      const fur = ['#382f30', '#594138', '#6a4e3d', '#80634b'].map(color => material(color));
      const bone = material('#e4d2a0', { roughness: .54 });
      const darkBone = material('#b09871');
      const brass = material('#b78750', { metalness: .45, roughness: .45 });
      const iron = material('#4c5153', { metalness: .42 });
      const hide = material('#45332d');
      const darkHide = material('#241f24');
      const cord = material('#9b754c');
      const cloth = material('#62434d', { side: THREE.DoubleSide });
      const darkCloth = material('#48303c', { side: THREE.DoubleSide });
      const ochre = material('#c38355');
      const wood = material('#4e342c');
      const bark = material('#271f24');
      const woodGold = material('#76503a');
      const featherColors = [material('#9e494b'), material('#ccc0a3'), material('#3f8987')];
      const idleCrystal = new THREE.Color('#88f1d7');
      const idleEyes = new THREE.Color('#ffe49b');
      const spellColor = new THREE.Color();

      function group(parent, x = 0, y = 0, z = 0) {
        const object = new THREE.Group();
        object.position.set(x, y, z);
        parent.add(object);
        return object;
      }

      function mesh(parent, geometry, mat, x, y, z, sx = 1, sy = 1, sz = 1, shadows = true) {
        const object = new THREE.Mesh(geometry, mat);
        object.position.set(x, y, z);
        object.scale.set(sx, sy, sz);
        object.castShadow = shadows;
        object.receiveShadow = shadows;
        parent.add(object);
        return object;
      }

      function between(parent, geometry, mat, a, b, width, depth = width, shadows = true) {
        const direction = b.clone().sub(a);
        const mid = a.clone().lerp(b, .5);
        const object = mesh(parent, geometry, mat, mid.x, mid.y, mid.z, width, direction.length(), depth, shadows);
        object.quaternion.setFromUnitVectors(up, direction.normalize());
        return object;
      }

      function tube(parent, points, radius, mat, segments = 14, radial = 6, shadows = true) {
        const curve = new THREE.CatmullRomCurve3(points);
        const geometry = new THREE.TubeGeometry(curve, segments, radius, radial, false);
        return mesh(parent, geometry, mat, 0, 0, 0, 1, 1, 1, shadows);
      }

      function taperedCurve(parent, points, radius, mat) {
        const curve = new THREE.CatmullRomCurve3(points);
        const vertices = [];
        const indices = [];
        const n = 12;
        const sides = 8;
        const frames = curve.computeFrenetFrames(n, false);
        for (let i = 0; i <= n; i++) {
          const p = curve.getPointAt(i / n);
          const r = radius * Math.max(.012, (1 - i / n) ** .8);
          for (let j = 0; j < sides; j++) {
            const theta = j / sides * tau;
            const vertex = p.clone().addScaledVector(frames.normals[i], Math.cos(theta) * r)
              .addScaledVector(frames.binormals[i], Math.sin(theta) * r);
            vertices.push(...vertex.toArray());
            if (i < n) {
              const a = i * sides + j;
              const b = i * sides + (j + 1) % sides;
              indices.push(a, b, a + sides, b, b + sides, a + sides);
            }
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return mesh(parent, geometry, mat, 0, 0, 0);
      }

      function makeGlowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 64;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, '#fff');
        gradient.addColorStop(.16, 'rgba(255,255,255,.86)');
        gradient.addColorStop(.43, 'rgba(255,255,255,.3)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const glowTexture = makeGlowTexture();

      function halo(parent, color, size, opacity) {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTexture, color, opacity, transparent: true, depthWrite: false,
          blending: THREE.AdditiveBlending, toneMapped: false
        }));
        sprite.scale.set(size, size, 1);
        parent.add(sprite);
        return sprite;
      }

      function setupLights() {
        scene.add(new THREE.HemisphereLight('#bfdbfb', '#76605b', 2));
        const moonlight = new THREE.DirectionalLight('#c5dfff', 2.6);
        moonlight.position.set(-4.8, 8.5, 4.4);
        moonlight.castShadow = true;
        moonlight.shadow.mapSize.set(1536, 1536);
        Object.assign(moonlight.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: .5, far: 25 });
        moonlight.shadow.normalBias = .044;
        moonlight.shadow.bias = -.0002;
        moonlight.target.position.set(.25, 0, 0);
        scene.add(moonlight, moonlight.target);

        const rim = new THREE.DirectionalLight('#84cfff', 1.9);
        rim.position.set(2, 5, -7);
        scene.add(rim);
        const fill = new THREE.DirectionalLight('#c0acae', .57);
        fill.position.set(6, 2, 8);
        scene.add(fill);
      }

      // A moonlit clearing. Repeated scenery shares instanced geometry.
      function createEnvironment() {
        const world = group(scene);
        const random = terrainRandom;
        const batches = new Map();
        const stamp = new THREE.Object3D();
        const palette = colors => colors.map(color => new THREE.Color(color));
        const dirt = palette(['#2e4140', '#344747', '#384745', '#3d4b45', '#304440', '#485249']);
        const slates = palette(['#3a4c52', '#4b575e', '#485f63', '#53656b', '#35454c']);
        const needles = palette(['#1e333e', '#263d42', '#26353f', '#2c4548', '#344751', '#1e2937']);
        const grasses = palette(['#4c6653', '#465550', '#526657', '#3e5655', '#686a53']);
        const choose = array => array[Math.floor(random(0, array.length))];

        function instance(geometry, x, y, z, sx, sy, sz, yaw, color, options = {}) {
          const { shadow = false, pitch = 0, roll = 0 } = options;
          const key = geometry.uuid + shadow;
          const batch = batches.get(key) ?? { geometry, shadow, entries: [] };
          stamp.position.set(x, y, z);
          stamp.scale.set(sx, sy, sz);
          stamp.rotation.set(pitch, yaw, roll);
          stamp.updateMatrix();
          batch.entries.push({ matrix: stamp.matrix.clone(), color });
          batches.set(key, batch);
        }

        const sky = new THREE.Mesh(
          new THREE.SphereGeometry(72, 22, 16),
          new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            uniforms: {
              nadir: { value: new THREE.Color('#354f65') },
              zenith: { value: new THREE.Color('#101426') }
            },
            vertexShader: `
              varying vec3 skyRay;
              void main() {
                skyRay = normalize(position);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }`,
            fragmentShader: `
              uniform vec3 nadir;
              uniform vec3 zenith;
              varying vec3 skyRay;
              void main() {
                float height = smoothstep(-0.08, 0.43, normalize(skyRay).y);
                gl_FragColor = vec4(mix(nadir, zenith, height), 1.0);
                #include <colorspace_fragment>
              }`
          })
        );
        sky.renderOrder = -20;
        world.add(sky);

        const moon = group(world, 3.6, 6.2, -27);
        const moonDisc = mesh(moon, new THREE.CircleGeometry(.99, 52), new THREE.MeshBasicMaterial({
          color: '#d3e6f4', fog: false, toneMapped: false
        }), 0, 0, 0, 1, 1, 1, false);
        moonDisc.rotation.y = -.08;
        const moonGlow = halo(moon, '#789dff', 8, .45);
        moonGlow.material.fog = false;
        moonGlow.position.z = -.72;
        for (let i = 0; i < 22; i++) {
          const angle = random(0, tau);
          const radial = Math.sqrt(random(0, .82));
          const mark = mesh(moon, geo.roundRock, new THREE.MeshBasicMaterial({
            color: i % 2 ? '#918fbb' : '#809fbf', fog: false, transparent: true, opacity: random(.05, .16), depthWrite: false
          }), Math.cos(angle) * radial, Math.sin(angle) * radial, .07, random(.06, .25), random(.02, .10), .01, false);
          mark.rotation.z = random(-.8, .8);
        }

        const starPositions = [];
        const starColors = [];
        for (let i = 0; i < 380; i++) {
          const angle = random(0, tau);
          const height = random(.024, .62);
          const radius = Math.sqrt(1 - height ** 2) * 58;
          starPositions.push(Math.cos(angle) * radius, height * 58, Math.sin(angle) * radius);
          const intensity = random(.17, .72);
          starColors.push(intensity * .75, intensity * .83, intensity);
        }
        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
        world.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({
          size: .15, map: glowTexture, vertexColors: true, transparent: true,
          depthWrite: false, blending: THREE.AdditiveBlending, fog: false, toneMapped: false
        })));

        const floor = mesh(world, new THREE.CircleGeometry(47, 80), material('#334441'), 0, -.07, 0, 1, 1, 1, false);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        const groundPositions = [];
        const groundColors = [];
        const terrain = (x, z) => x * x + z * z < 39 ? -.026 : -.02 + .045 * Math.sin(x * .86) * Math.cos(z * .72);
        for (let x = -16; x < 16; x += 1.7) {
          for (let z = -17; z < 13; z += 1.55) {
            const corners = [[x, z], [x, z + 1.55], [x + 1.7, z + 1.55], [x + 1.7, z]];
            for (const triangle of [[0, 1, 2], [0, 2, 3]]) {
              const color = choose(dirt).clone().multiplyScalar(random(.92, 1.13));
              for (const index of triangle) {
                const [px, pz] = corners[index];
                groundPositions.push(px, terrain(px, pz), pz);
                groundColors.push(color.r, color.g, color.b);
              }
            }
          }
        }
        const terrainGeometry = new THREE.BufferGeometry();
        terrainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(groundPositions, 3));
        terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(groundColors, 3));
        terrainGeometry.computeVertexNormals();
        mesh(world, terrainGeometry, material('#ffffff', { vertexColors: true }), 0, 0, 0, 1, 1, 1, false).receiveShadow = true;

        const pine = new THREE.ConeGeometry(1, 1, 6);
        const treeTrunk = new THREE.CylinderGeometry(.53, 1, 1, 6);
        for (let i = 0; i < 115; i++) {
          const x = random(-29, 29);
          const z = random(-32, 10);
          if ((z > -5.1 && Math.abs(x) < 7.5) || (z > 1 && Math.abs(x) < 10)) continue;
          const h = random(3.4, 8.4);
          const width = h * random(.12, .24);
          const lean = random(-.10, .10);
          const yaw = random(0, tau);
          const color = choose(needles);
          instance(treeTrunk, x, h * .36 - .05, z, h * .035, h * .77, h * .038, yaw,
            new THREE.Color('#322e33'), { roll: lean });
          for (let layer = 0; layer < 4; layer++) {
            const w = width * (1 - layer * .19);
            instance(pine, x - lean * h * .23, h * (.41 + .16 * layer), z, w, h * (.49 - layer * .055), w * random(.8, 1.1),
              yaw + layer * .81, color.clone().multiplyScalar(.77 + layer * .14), { roll: lean });
          }
        }

        for (const [x, z, h] of [[-6.2, -1.2, 8.4], [6.1, -.2, 7.1], [-4.1, -5.6, 7.3], [5.7, -5.5, 7.9]]) {
          instance(treeTrunk, x, h * .41, z, .29, h * .85, .3, .5, new THREE.Color('#353640'), { roll: -.09 });
          for (let i = 0; i < 5; i++) {
            const width = (5 - i) * .29;
            instance(pine, x + .31, h * (.43 + .127 * i), z, width, h * (.45 - .044 * i), width,
              i * 1.3, choose(needles), { roll: -.11 });
          }
          for (let i = 0; i < 5; i++) {
            const angle = i / 5 * tau;
            between(world, geo.cone, bark, V(x, .28, z), V(x + Math.cos(angle) * .91, -.07, z + Math.sin(angle) * .91), .15, .18, false);
          }
        }

        for (let i = 0; i < 126; i++) {
          const x = random(-15, 15);
          const z = random(-15, 9);
          if (Math.hypot(x + 1.35, z) < 2.55 || Math.hypot(x - 2.75, z - 1.1) < 1.9) continue;
          const size = random(.11, .61);
          instance(geo.dodeca, x, size * .06, z, size, size * random(.27, .91), size * random(.49, .93), random(0, tau),
            choose(slates), { shadow: z > -5 && Math.abs(x) < 7, roll: random(-.26, .26) });
        }

        for (const [x, y, z, width] of [[-4.8, .24, -.85, 1.11], [-5.4, .37, -1.8, 1.36], [5.1, .22, 1.4, .86], [5.7, .38, .7, 1.18], [4.5, .28, -2.45, 1.12], [-3.8, .32, -3.5, 1.08]]) {
          instance(geo.dodeca, x, y, z, width, y * 2.25, width * .69, random(0, tau), choose(slates), { shadow: true });
          instance(geo.roundRock, x + .09, y * 1.9, z - .12, width * .81, y * 1.46, width * .47, random(0, tau),
            new THREE.Color('#456455'), { pitch: -.24 });
        }

        const ritualX = -1.25;
        for (let i = 0; i < 32; i++) {
          const theta = i / 32 * tau;
          const radius = 1.86 + random(-.05, .05);
          instance(geo.dodeca, ritualX + Math.cos(theta) * radius, .018, Math.sin(theta) * radius,
            random(.15, .21), random(.063, .125), random(.165, .23), -theta + .25, choose(slates), { shadow: true });
        }

        for (let i = 0; i < 57; i++) {
          const x = random(.24, 4.2);
          const z = random(-1.12, 2.45);
          const center = .16 + (x - .15) * .31;
          if (Math.abs(z - center) > random(.18, 1.18)) continue;
          const size = random(.064, .27);
          instance(geo.roundRock, x, .011, z, size, size * .13, size * random(.42, .85), random(0, tau), choose(slates));
        }

        const runeMaterial = glowMaterial('#80cabb', .43);
        const rimMaterial = glowMaterial('#539c9e', .34);
        for (const radius of [1.47, 1.62]) {
          const ring = mesh(world, new THREE.RingGeometry(radius, radius + .012, 90), rimMaterial, ritualX, .005, 0, 1, 1, 1, false);
          ring.rotation.x = -Math.PI / 2;
        }
        for (let i = 0; i < 12; i++) {
          const theta = i / 12 * tau;
          const marker = group(world, ritualX + Math.cos(theta) * 1.555, .013, Math.sin(theta) * 1.555);
          marker.rotation.y = -theta;
          const stem = mesh(marker, geo.box, runeMaterial, 0, 0, 0, .13, .003, .013, false);
          stem.rotation.y = Math.PI / 2;
          for (const side of [-1, 1]) {
            const branch = mesh(marker, geo.box, runeMaterial, side * .035, 0, -.029, .077, .003, .012, false);
            branch.rotation.y = side * .6;
          }
        }

        const blade = new THREE.BufferGeometry();
        blade.setAttribute('position', new THREE.Float32BufferAttribute([-.5, 0, 0, .43, 0, 0, .24, .58, .13, 0, 1, .44, -.14, .5, .12], 3));
        blade.setIndex([0, 1, 2, 2, 3, 4, 4, 0, 2]);
        blade.computeVertexNormals();
        for (let i = 0; i < 590; i++) {
          const x = random(-12, 12);
          const z = random(-12, 9);
          if (Math.hypot(x + 1.25, z) < 2.05 || Math.hypot(x - 2.7, z - 1.02) < 1.05 ||
              (x > 0 && x < 3.6 && Math.abs(z - .29 * x) < .53)) continue;
          const yaw = random(0, tau);
          const color = choose(grasses);
          for (let j = -1; j <= 1; j++) {
            const height = random(.065, .28) * (z > 3.5 ? 1.26 : 1);
            instance(blade, x + .03 * j, -.015, z, height * .3, height, height, yaw + j * 1.4, color,
              { pitch: random(-.31, .3), roll: j * .35 });
          }
        }

        for (const [x, z] of [[-3.7, 1.4], [-3.1, 1.55], [3.9, 2.15], [4.4, 1.8], [-1.3, -2.65], [.74, 2.68], [-4.2, 3.22], [1.1, -2.62]]) {
          for (let i = 0; i < 7; i++) {
            const a = i / 7 * tau;
            const length = random(.2, .43);
            instance(blade, x, 0, z, length * .36, length, length * 1.15, a, choose(grasses), { pitch: .6 + random(-.3, .16) });
          }
        }

        for (const [x, z] of [[-3.03, 1.03], [-3.21, .88], [4.28, .83], [4.46, .98], [4.63, .71]]) {
          const h = random(.09, .18);
          instance(geo.cylinder, x, h * .46, z, .022, h, .022, 0, new THREE.Color('#a5a081'));
          instance(geo.sphere, x, h, z, h * .5, h * .36, h * .5, 0, new THREE.Color('#b77955'));
        }

        const decor = material('#ffffff', { side: THREE.DoubleSide });
        for (const { geometry, shadow, entries } of batches.values()) {
          const batch = new THREE.InstancedMesh(geometry, decor, entries.length);
          for (let i = 0; i < entries.length; i++) {
            batch.setMatrixAt(i, entries[i].matrix);
            batch.setColorAt(i, entries[i].color);
          }
          batch.castShadow = shadow;
          batch.receiveShadow = true;
          world.add(batch);
        }

        const camp = group(world, .52, .02, -2.85);
        const ashMaterial = material('#1c2020');
        mesh(camp, geo.dodeca, ashMaterial, 0, .018, 0, .48, .061, .45);
        for (let i = 0; i < 9; i++) {
          const a = i / 9 * tau;
          const stone = mesh(camp, geo.dodeca, iron, Math.cos(a) * .44, .059, Math.sin(a) * .41, .13, random(.065, .114), .125);
          stone.rotation.y = a;
        }
        for (let i = 0; i < 4; i++) {
          const a = i / 4 * tau;
          between(camp, geo.cylinder, wood, V(Math.cos(a) * .30, .064, Math.sin(a) * .26),
            V(Math.cos(a + Math.PI) * .19, .15, Math.sin(a + Math.PI) * .17), .055);
        }

        const light = new THREE.PointLight('#ff983d', 14, 6, 2);
        light.position.y = .54;
        camp.add(light);
        const flames = Array.from({ length: 8 }, (_, i) => {
          const flame = mesh(camp, geo.cone, glowMaterial(i % 3 === 0 ? '#ffe8a1' : '#ff7b32', .56), 0, .28, 0, .15, .42, .15, false);
          return { flame, phase: random(0, tau), x: random(-.13, .13), z: random(-.12, .12), height: random(.26, .63) };
        });
        const glow = halo(camp, '#ff913c', 1.6, .55);
        glow.position.y = .32;
        return { camp, light, flames, glow };
      }

      // Joint hierarchy, costume, and staff.
      function feather(parent, x, y, z, length, width, mat, angle) {
        const pivot = group(parent, x, y, z);
        pivot.rotation.z = angle;
        const shape = new THREE.BufferGeometry();
        shape.setAttribute('position', new THREE.Float32BufferAttribute([
          0, 0, 0, .17, .17, 0, .52, .54, .08, .37, .88, .11, -.14, 1, .15,
          -.51, .63, .07, -.33, .27, 0, 0, .53, .18
        ], 3));
        shape.setIndex([0,1,7, 1,2,7, 2,3,7, 3,4,7, 4,5,7, 5,6,7, 6,0,7]);
        shape.computeVertexNormals();
        mesh(pivot, shape, mat, 0, 0, 0, width, length, length);
        between(pivot, geo.cylinder, darkBone, V(0, .005, .008), V(-.033 * width, .88 * length, .153 * length), width * .04, width * .032, false);
        return { pivot, angle };
      }

      function createStaff(hand) {
        const staff = group(hand);
        const shaftPoints = [V(.07, -1.22, -.034), V(.008, -.82, -.009), V(-.034, -.32, .017),
          V(0, 0, 0), V(.044, .46, -.026), V(-.015, .76, 0)];
        tube(staff, shaftPoints, .059, wood, 23, 8);
        tube(staff, shaftPoints.map(p => p.clone().add(V(.038, 0, .032))), .011, woodGold, 21, 4, false);
        mesh(staff, geo.cylinder, iron, .067, -1.16, -.031, .066, .12, .065);
        for (let i = 0; i < 6; i++) {
          const wrap = mesh(staff, geo.torus, i === 0 || i === 5 ? brass : cord, 0, -.14 + i * .047, 0, .063, .063, .094);
          wrap.rotation.set(Math.PI / 2 - .12, .11, 0);
        }

        mesh(staff, geo.cylinder, brass, .024, .53, -.014, .103, .086, .1);
        mesh(staff, geo.dodeca, woodGold, 0, .704, 0, .159, .15, .12);
        for (const side of [-1, 1]) {
          taperedCurve(staff, [V(side * .04, .69, -.05), V(side * .23, .9, .008),
            V(side * .235, 1.15, .04), V(side * .11, 1.29, .04)], .088, woodGold);
          taperedCurve(staff, [V(side * .15, 1.00, .025), V(side * .197, 1.14, .068),
            V(side * .096, 1.26, .076)], .046, bone);
        }
        taperedCurve(staff, [V(0, .7, -.06), V(.04, .95, -.17), V(.015, 1.19, -.13)], .072, wood);
        const crystalMaterial = material('#69c9b4', { emissive: idleCrystal, emissiveIntensity: 1.3, roughness: .27, metalness: .17 });
        const crystal = mesh(staff, geo.crystal, crystalMaterial, 0, 1.011, .02, .155, .25, .138);
        const fleck = mesh(crystal, geo.crystal, glowMaterial('#dcffec', .32), 0, 0, 0, .66, .73, .66, false);
        fleck.rotation.y = .34;
        const crystalGlow = halo(staff, idleCrystal, 1.20, .68);
        crystalGlow.position.copy(crystal.position);
        const light = new THREE.PointLight(idleCrystal, 6, 5.5, 2);
        crystal.add(light);

        const skull = group(staff, .026, .51, .12);
        skull.rotation.z = -.1;
        mesh(skull, geo.ico, bone, 0, 0, 0, .118, .089, .074);
        mesh(skull, geo.cone, darkBone, 0, -.077, .031, .066, .124, .054).rotation.z = Math.PI;
        for (const side of [-1, 1]) {
          mesh(skull, geo.ico, bark, side * .045, .012, .063, .028, .025, .012);
          taperedCurve(skull, [V(side * .079, .025, 0), V(side * .151, .066, -.006), V(side * .165, .135, -.01)], .037, bone);
        }

        const hangings = [];
        for (let i = 0; i < 3; i++) {
          const hanging = group(staff, -.101 + .105 * i, .60 - .07 * i, .062);
          between(hanging, geo.cylinder, cord, V(), V(.007, -.25 - .052 * i, .01), .009);
          for (let bead = 1; bead <= 4; bead++) {
            mesh(hanging, geo.sphere, bead % 2 ? darkBone : featherColors[i], 0, -.049 * bead, .01, .027, .024, .025);
          }
          const tag = feather(hanging, .007, -.22 - .05 * i, .013, .32 - i * .035, .105, featherColors[i], Math.PI - .23 * (i - 1));
          tag.pivot.rotation.y = i * .56;
          hangings.push(hanging);
        }
        return { staff, crystal, crystalGlow, light, hangings };
      }

      function createShaman() {
        const root = group(scene, -1.25, 0, 0);
        root.name = 'shaman';
        root.rotation.y = .18;
        const torso = group(root, 0, 2.25, -.085);
        torso.name = 'torso';
        const body = group(torso);
        mesh(body, geo.sphere, skinShade, 0, -.33, -.02, .68, .59, .35);
        mesh(body, geo.sphere, skin, 0, -.26, .055, .62, .49, .33);
        mesh(body, geo.sphere, hide, 0, -.7, .026, .44, .45, .31);
        mesh(body, geo.sphere, fur[1], 0, -.19, -.12, .86, .35, .416);
        mesh(body, geo.sphere, fur[0], 0, -.51, -.25, .62, .56, .22);
        for (let i = 0; i < 20; i++) {
          const a = i / 20 * tau;
          const x = Math.cos(a) * .71;
          const z = Math.sin(a) * .35 - .063;
          const tuft = mesh(body, geo.cone, fur[i % fur.length], x, -.23 - .093 * Math.abs(x), z, .14 + .032 * (i % 3), .37, .14);
          tuft.rotation.set(Math.sin(a) * -.6, -a, Math.PI + Math.cos(a) * .6);
        }
        for (let i = 0; i < 9; i++) {
          const side = i < 4 ? -1 : 1;
          const tuft = mesh(body, geo.cone, fur[(i + 1) % 4], side * (.39 + (i % 4) * .11), -.34 - .065 * (i % 4), .185,
            .09, .32 + (i % 3) * .045, .114);
          tuft.rotation.set(-.43, i * .85, Math.PI - side * .21);
        }

        mesh(body, geo.cylinder, darkHide, 0, -.825, .03, .46, .195, .336);
        for (const y of [-.788, -.863]) {
          const belt = mesh(body, geo.torus, cord, 0, y, .03, .444, .332, .23);
          belt.rotation.x = Math.PI / 2;
        }
        const buckle = mesh(body, geo.torus, brass, -.055, -.826, .368, .106, .104, .14);
        buckle.rotation.z = .15;
        mesh(body, geo.dodeca, bone, -.052, -.829, .373, .056, .068, .037);
        for (const side of [-1, 1]) {
          mesh(body, geo.dodeca, ochre, side * .386, -.984, .185, .12, .151, .103);
          mesh(body, geo.sphere, hide, side * .386, -.925, .234, .113, .053, .071);
          mesh(body, geo.sphere, brass, side * .386, -.951, .29, .026, .022, .018);
        }

        const skirt = group(body, 0, -.825, .014);
        const skirtGeometry = new THREE.CylinderGeometry(.39, .59, .74, 9, 2, true, .52, tau - 1.04);
        const skirtMesh = mesh(skirt, skirtGeometry, darkCloth, 0, -.385, 0, 1, 1, .68);
        skirtMesh.rotation.y = -.03;
        const tabardGeometry = new THREE.BufferGeometry();
        tabardGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
          -.22, -.07, .32, .23, -.06, .32, .25, -.5, .42, .11, -.85, .45,
          -.20, -.78, .39, -.28, -.49, .39, 0, -.43, .445
        ], 3));
        tabardGeometry.setIndex([0,6,1, 1,6,2, 2,6,3, 3,6,4, 4,6,5, 5,6,0]);
        tabardGeometry.computeVertexNormals();
        const tabard = group(skirt);
        mesh(tabard, tabardGeometry, cloth, 0, 0, 0);
        for (const side of [-1, 1]) {
          between(tabard, geo.cylinder, ochre, V(side * .181, -.17, .341), V(side * .205, -.48, .417), .012);
          between(tabard, geo.cylinder, ochre, V(side * .205, -.48, .417), V(side * .08, -.682, .442), .012);
          between(tabard, geo.box, darkBone, V(0, -.35, .448), V(side * .092, -.463, .446), .021, .011, false);
          between(tabard, geo.box, darkBone, V(0, -.572, .45), V(side * .092, -.463, .446), .021, .011, false);
        }
        for (let i = -2; i <= 2; i++) {
          const a = V(i * .049, -.744 + .035 * i, .44 + i * .006);
          between(tabard, geo.cylinder, cord, a, a.clone().add(V(.012, -.131, .034)), .012);
        }

      function updateDummy(dt) {
        // Exact damped oscillator step, stable across different frame rates.
        const decay = 5.1;
        const omega = 12;
        const fade = Math.exp(-decay * dt);
        const sin = Math.sin(omega * dt);
        const cos = Math.cos(omega * dt);
        for (const axis of ['X', 'Z']) {
          const tilt = dummy['tilt' + axis];
          const speed = dummy['impulse' + axis];
          const b = (speed + decay * tilt) / omega;
          const nextTilt = fade * (tilt * cos + b * sin);
          dummy['tilt' + axis] = nextTilt;
          dummy['impulse' + axis] = fade * omega * (b * cos - tilt * sin) - decay * nextTilt;
        }
        dummy.pivot.rotation.set(dummy.tiltX, 0, dummy.tiltZ);
        dummy.flash *= Math.exp(-dt * 8.7);
        dummy.burlap.emissiveIntensity = dummy.flash * 2.4;
        dummy.coarse.emissiveIntensity = dummy.flash * 1.6;
      }

      function poseLimb(limb, target, bend, handRotation) {
        const { upper, upperLength, forearm, lowerLength, hand } = limb;
        limbDirection.copy(target).sub(upper.position);
        const length = clamp(limbDirection.length(), .052, upperLength + lowerLength - .006);
        limbDirection.normalize();
        const along = (upperLength ** 2 - lowerLength ** 2 + length ** 2) / (2 * length);
        const height = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        limbBend.copy(bend).addScaledVector(limbDirection, -bend.dot(limbDirection)).normalize();
        upperDirection.copy(limbDirection).multiplyScalar(along).addScaledVector(limbBend, height);
        foreDirection.copy(limbDirection).multiplyScalar(length).sub(upperDirection);
        worldUpper.setFromUnitVectors(down, upperDirection.normalize());
        worldFore.setFromUnitVectors(down, foreDirection.normalize());
        upper.quaternion.copy(worldUpper);
        forearm.quaternion.copy(inverse.copy(worldUpper).invert()).multiply(worldFore);
