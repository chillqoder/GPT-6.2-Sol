        if (type === 'earthquake') {
          const grip = clamp(pose.grip[0]);
          shaftGrip.set(.005, .32, .01).applyQuaternion(staffRotation).add(wristRight);
          wristLeft.lerp(shaftGrip, grip);
          palmRotation.slerp(footRotation.setFromEuler(rotation.set(.51, -.23, 1.76)), grip);
        }
        poseLimb(shaman.right, wristRight, rightBend, staffRotation);
        poseLimb(shaman.left, wristLeft, leftBend, palmRotation);
        for (const finger of shaman.left.fingers) {
          finger.rotation.x = .15 + pose.grip[0] * .86 + Math.sin(t * 1.4) * .07;
        }

        for (const leg of shaman.legs) {
          footTarget.set(leg.side * .44 - pose.hips[0], .112 - pose.hips[1], leg.side * -.075 + .035);
          footRotation.setFromEuler(rotation.set(0, leg.side * .20 - pose.hips[2], 0));
          poseLimb(leg, footTarget, kneeBend, footRotation);
        }
      }

      // One capped particle buffer serves sparks, embers, dust, and spirit wisps.
      const particleLimit = 640;
      const particles = [];
      const pointsGeometry = new THREE.BufferGeometry();
      const pointPositions = new Float32Array(particleLimit * 3);
      const pointColors = new Float32Array(particleLimit * 3);
      const pointSizes = new Float32Array(particleLimit);
      const pointOpacities = new Float32Array(particleLimit);
      for (const [name, data, size] of [
        ['position', pointPositions, 3], ['particleColor', pointColors, 3],
        ['pointSize', pointSizes, 1], ['pointOpacity', pointOpacities, 1]
      ]) {
        pointsGeometry.setAttribute(name, new THREE.BufferAttribute(data, size).setUsage(THREE.DynamicDrawUsage));
      }
      const particlesMaterial = new THREE.ShaderMaterial({
        uniforms: { sprite: { value: glowTexture }, pixelScale: { value: 1 } },
        vertexShader: `
          attribute vec3 particleColor;
          attribute float pointSize;
          attribute float pointOpacity;
          uniform float pixelScale;
          varying vec3 tint;
          varying float alpha;
          void main() {
            vec4 view = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * view;
            gl_PointSize = clamp(pointSize * pixelScale / max(0.1, -view.z), 1.0, 140.0);
            tint = particleColor;
            alpha = pointOpacity;
          }`,
        fragmentShader: `
          uniform sampler2D sprite;
          varying vec3 tint;
          varying float alpha;
          void main() {
            gl_FragColor = vec4(tint, texture2D(sprite, gl_PointCoord).a * alpha);
            #include <colorspace_fragment>
          }`,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
      });
      const particleField = new THREE.Points(pointsGeometry, particlesMaterial);
      particleField.frustumCulled = false;
      particleField.renderOrder = 4;
      scene.add(particleField);

      function createParticleBurst({ position, count, color, endColor = color, speed = 1, gravity = 0, life = .5, size = .12, spread = 0,
        lift = 0, opacity = .85, drag = .7 }) {
        const startTint = new THREE.Color(color);
        const endTint = new THREE.Color(endColor);
        for (let i = 0; i < count && particles.length < particleLimit; i++) {
          const theta = range(0, tau);
          const y = range(-.32, 1);
          const radius = Math.sqrt(1 - y * y);
          const direction = V(Math.cos(theta) * radius, y, Math.sin(theta) * radius);
          const p = position.clone().addScaledVector(direction, range(0, spread));
          const velocity = direction.multiplyScalar(range(.21, 1) * speed);
          velocity.y += lift;
          const lifetime = life * range(.54, 1.22);
          particles.push({ p, velocity, startTint, endTint, gravity, lifetime, age: 0, size: size * range(.52, 1.2), opacity, drag });
        }
      }

      function writeParticle(index, position, color, size, opacity) {
        position.toArray(pointPositions, index * 3);
        color.toArray(pointColors, index * 3);
        pointSizes[index] = size;
        pointOpacities[index] = opacity;
      }

      const particleColor = new THREE.Color();
      const wispColor = new THREE.Color('#77d1c3');
      const wispPosition = V();
      function updateParticles(dt, t) {
        let count = 0;
        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.age += dt;
          const progress = particle.age / particle.lifetime;
          if (progress >= 1) {
            particles[i] = particles[particles.length - 1];
            particles.pop();
            continue;
          }
          particle.velocity.y += particle.gravity * dt;
          particle.velocity.multiplyScalar(Math.exp(-particle.drag * dt));
          particle.p.addScaledVector(particle.velocity, dt);
          if (particle.p.y < .046 && particle.gravity < 0) {
            particle.p.y = .046;
            particle.velocity.y = Math.abs(particle.velocity.y) * .34;
            particle.velocity.x *= .8;
            particle.velocity.z *= .8;
          }
          particleColor.copy(particle.startTint).lerp(particle.endTint, progress);
          writeParticle(count++, particle.p, particleColor, particle.size * (1 - progress * .58), particle.opacity * (1 - progress) ** .85);
        }

        for (let i = 0; i < 25 && count < particleLimit; i++) {
          const phase = i * 2.399 + t * (.21 + (i % 4) * .054);
          const radius = 1.09 + (i % 9) * .52;
          wispPosition.set(-.88 + Math.cos(phase) * radius, .25 + (i % 7) * .34 + Math.sin(phase * 1.28) * .26,
            -.55 + Math.sin(phase) * radius);
          writeParticle(count++, wispPosition, wispColor, i % 3 ? .075 : .145, .23 + .30 * Math.sin(phase * 1.41) ** 2);
        }

        pointsGeometry.setDrawRange(0, count);
        for (const attr of Object.values(pointsGeometry.attributes)) {
          attr.clearUpdateRanges();
          attr.addUpdateRange(0, count * attr.itemSize);
          attr.needsUpdate = true;
        }
      }

      // Transient spell visuals release their owned GPU resources after use.
      const effects = [];
      const numbers = [];
      const shockRing = new THREE.RingGeometry(.93, 1, 72);
      const thinRing = new THREE.RingGeometry(.985, 1, 72);
      const fireLight = new THREE.PointLight('#ff822c', 0, 4.8);
      const earthLight = new THREE.PointLight('#8afa6f', 0, 5);
      scene.add(fireLight, earthLight);
      const flightCurve = new THREE.QuadraticBezierCurve3();
      const fireCenter = V();
      const targetLabel = document.querySelector('#target-label');
      const damageLayer = document.querySelector('#damage');
      const flashLayer = document.querySelector('#flash');
      let shakeRemaining = 0;
      let shakeTime = 0;
      let shakeStrength = 0;
      let flashRemaining = 0;

      function addEffect(duration, update, dispose = () => {}) {
        effects.push({ age: 0, duration, update, dispose });
      }

      function updateEffects(dt) {
        for (let i = effects.length - 1; i >= 0; i--) {
          const effect = effects[i];
          effect.age += dt;
          effect.update(Math.min(effect.age, effect.duration));
          if (effect.age >= effect.duration) {
            effect.dispose();
            effects.splice(i, 1);
          }
        }
      }

      function addShake(duration, strength) {
        shakeRemaining = shakeTime = reducedMotion.matches ? 0 : duration;
        shakeStrength = strength;
      }

      function makeRing(position, color, radius, duration, options = {}) {
        const { delay = 0, thickness = false, opacity = .76 } = options;
        const mat = glowMaterial(color, opacity);
        const ring = mesh(scene, thickness ? shockRing : thinRing, mat, position.x, .035 + delay * .01, position.z, .04, .04, 1, false);
        ring.rotation.x = -Math.PI / 2;
        ring.visible = delay === 0;
        addEffect(duration + delay, age => {
          const progress = clamp((age - delay) / duration);
          ring.visible = age >= delay;
          ring.scale.setScalar(lerp(.08, radius, cubeOut(progress)));
          mat.opacity = opacity * (1 - progress) ** 1.36;
        }, () => {
          ring.removeFromParent();
          mat.dispose();
        });
      }

      function makePulse(position, color, scale, duration, opacity = .6) {
        const mat = glowMaterial(color, opacity);
        const burst = mesh(scene, geo.roundRock, mat, ...position.toArray(), .09, .09, .09, false);
        addEffect(duration, age => {
          const progress = age / duration;
          burst.scale.setScalar(lerp(.09, scale, cubeOut(progress)));
          mat.opacity = opacity * (1 - progress) ** 2.45;
        }, () => {
          burst.removeFromParent();
          mat.dispose();
        });
      }

      function drawBolt(parent, getStart, getEnd, width, jitter) {
        const origin = V();
        const chord = getEnd().sub(getStart());
        const chordLength = chord.length();
        const chordDirection = chord.clone().normalize();
        const core = glowMaterial('#d7f3ff', 1);
        const glow = glowMaterial('#359aff', .34);
        const branch = glowMaterial('#70c5ff', .48);
        let paths = [];
        let lastShape = -1;

        function clearPaths() {
          for (const path of paths) {
            path.geometry.dispose();
            path.removeFromParent();
          }
          paths = [];
        }

        function displace(a, b, depth, offset) {
          if (!depth) return [a, b];
          const axis = b.clone().sub(a).normalize();
          const normal = V().crossVectors(axis, Math.abs(axis.y) > .88 ? V(1, 0, 0) : up).normalize();
          const binormal = V().crossVectors(axis, normal);
          const mid = a.clone().lerp(b, .5)
            .addScaledVector(normal, range(-offset, offset))
            .addScaledVector(binormal, range(-offset, offset));
          const left = displace(a, mid, depth - 1, offset * .49);
          return left.slice(0, -1).concat(displace(mid, b, depth - 1, offset * .49));
        }

        function beam(points, radius, mat) {
          paths.push(tube(parent, points, radius, mat, points.length * 2, 5, false));
        }

        addEffect(.30, age => {
          parent.position.copy(getStart());
          const liveChord = getEnd().sub(parent.position);
          parent.scale.setScalar(liveChord.length() / chordLength);
          parent.quaternion.setFromUnitVectors(chordDirection, liveChord.normalize());
          const shape = Math.min(3, Math.floor(age / .061));
          if (shape !== lastShape) {
            lastShape = shape;
            clearPaths();
            const points = displace(origin, chord, 5, jitter);
            beam(points, width, core);
            beam(points, width * 4, glow);
            for (const index of [8, 17, 23]) {
              const point = points[index];
              const offshoot = point.clone().add(V(range(-.8, .8), range(-.9, -.18), range(-.47, .47)));
              beam(displace(point, offshoot, 3, .16), width * .51, branch);
            }
          }
          const fade = (1 - age / .30) ** .79;
          const flicker = .79 + .21 * Math.sin(age * 216) ** 2;
          core.opacity = fade * flicker;
          glow.opacity = fade * .39;
          branch.opacity = fade * .65;
        }, () => {
          clearPaths();
          core.dispose();
          glow.dispose();
          branch.dispose();
          parent.removeFromParent();
        });
      }

      function castLightning(spell) {
        const target = getTargetPosition();
        const crystal = getStaffTipWorldPosition();
        const skyStrike = target.clone().add(V(.7, 6.5, -.25));
        drawBolt(group(scene), () => skyStrike, getTargetPosition, .015, .96);
        drawBolt(group(scene), getStaffTipWorldPosition, getTargetPosition, .019, .69);
        createParticleBurst({ position: target, count: 82, color: '#d2f3ff', endColor: '#346dff', speed: 4.8, gravity: -4, life: .64, spread: .09, size: .13 });
        createParticleBurst({ position: crystal, count: 26, color: '#9de4ff', endColor: '#296cf6', speed: 3, life: .44, size: .15 });
        makePulse(target, '#78bdff', .62, .25);
        makeRing(target, '#629dff', 1.13, .48, { thickness: true, opacity: .44 });
        if (!reducedMotion.matches) flashRemaining = .13;
        addShake(.12, .075);
        hitTarget(spell, 3.5);
        playSound('zap');
      }

      function palmPosition() {
        return shaman.left.hand.localToWorld(V(0, .133, .25));
      }

      function createFireOrb() {
        const root = group(scene);
        const core = mesh(root, geo.roundRock, glowMaterial('#fff1a8', .97), 0, 0, 0, .12, .12, .12, false);
        const shell = mesh(root, geo.ico, glowMaterial('#ff6425', .73), 0, 0, 0, .205, .205, .205, false);
        const aura = halo(root, '#ff7726', .92, .92);
        const seedPoints = Array.from({ length: 38 }, (_, i) => ({
          angle: i * 2.399, speed: range(3.2, 7.1), radius: range(.095, .29), height: range(-.135, .135)
        }));
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(seedPoints.length * 3);
        const attribute = new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage);
        geometry.setAttribute('position', attribute);
        const emberMaterial = new THREE.PointsMaterial({
          color: '#ffc66c', size: .075, map: glowTexture, transparent: true, opacity: .9,
          depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
        });
        const emberCloud = new THREE.Points(geometry, emberMaterial);
        emberCloud.frustumCulled = false;
        root.add(emberCloud);
        return {
          root,
          update(position, amount, age) {
            root.position.copy(position);
            root.scale.setScalar(amount);
            core.rotation.set(age * 5.4, age * 4, age * 1.7);
            shell.rotation.set(age * -6, age * 3, age * -3);
            aura.material.opacity = .71 + Math.sin(age * 47) * .13;
            for (let i = 0; i < seedPoints.length; i++) {
              const ember = seedPoints[i];
              const phase = ember.angle + age * ember.speed;
              positions[i * 3] = Math.cos(phase) * ember.radius;
              positions[i * 3 + 1] = ember.height * Math.cos(phase * .52);
              positions[i * 3 + 2] = Math.sin(phase) * ember.radius;
            }
            attribute.needsUpdate = true;
            fireLight.position.copy(position);
            fireLight.intensity = amount * (9 + 3 * Math.sin(age * 41) ** 2);
          },
          dispose() {
            root.removeFromParent();
            for (const tint of [core.material, shell.material, aura.material, emberMaterial]) tint.dispose();
            geometry.dispose();
            fireLight.intensity = 0;
          }
        };
      }

      function castFireball(spell, orb) {
        const start = palmPosition();
        const impact = getTargetPosition();
        const apex = start.clone().lerp(impact, .5);
        apex.y = Math.max(start.y, impact.y) + .85;
        flightCurve.v0.copy(start);
        flightCurve.v1.copy(apex);
        flightCurve.v2.copy(impact);
        let trailTime = 0;
        let lastAge = 0;
        playSound('whoosh');

        addEffect(.4, age => {
          flightCurve.getPoint(age / .4, fireCenter);
          orb.update(fireCenter, 1.1 + age * .36, age + .5);
          trailTime += age - lastAge;
          lastAge = age;
          while (trailTime >= .013) {
            trailTime -= .013;
            const trailPoint = flightCurve.getPoint(clamp((age - trailTime) / .4), V());
            createParticleBurst({ position: trailPoint, count: 4, color: '#ffde91', endColor: '#a12316', speed: .85, lift: .64,
              life: .46, size: .15, spread: .17 });
          }
        }, () => {
          orb.dispose();
          makePulse(impact, '#ffb85f', .96, .39, .82);
          makePulse(impact, '#ff662b', 1.46, .52, .36);
          makeRing(impact, '#ff9b51', 1.58, .85, { thickness: true });
          makeRing(impact, '#e75427', 1.21, 1.30, { delay: .07, opacity: .61 });
          createParticleBurst({ position: impact, count: 150, color: '#ffdf88', endColor: '#9f241c', speed: 5, gravity: -5.7,
            life: 1.02, size: .15, spread: .15 });
          addEffect(.33, age => {
            fireLight.position.copy(impact);
            fireLight.intensity = 47 * (1 - age / .33) ** 2;
          }, () => {
            fireLight.intensity = 0;
          });
          addShake(.18, .106);
          hitTarget(spell, 5.4);
          playSound('boom');
        });
      }

      function createEarthTotem(position) {
        const totem = group(scene, position.x, -1.35, position.z);
        totem.rotation.y = -.17;
        const eyes = glowMaterial('#aafa7b', .91);
        const glow = halo(totem, '#69e653', 1.45, .6);
        glow.position.y = .88;
        mesh(totem, geo.dodeca, iron, 0, .058, 0, .33, .141, .27);
        mesh(totem, geo.cylinder, wood, 0, .537, 0, .219, 1.062, .193);
        for (const y of [.134, .344, .941, 1.022]) {
          mesh(totem, geo.cylinder, y > .9 ? brass : woodGold, 0, y, 0, .228, .087, .211);
        }
        mesh(totem, geo.dodeca, woodGold, 0, .735, .052, .253, .27, .199);
        mesh(totem, geo.dodeca, iron, 0, .66, .205, .173, .183, .073);
        mesh(totem, geo.dodeca, bone, 0, .774, .257, .049, .057, .05);
        mesh(totem, geo.box, wood, 0, .592, .263, .156, .053, .03);
        mesh(totem, geo.box, eyes, 0, .59, .284, .097, .025, .01, false);
        mesh(totem, geo.crystal, eyes, 0, 1.14, 0, .09, .145, .079, false);
        for (const side of [-1, 1]) {
          const wing = group(totem, side * .18, .66, -.033);
          wing.rotation.z = side * -.32;
          for (let i = 0; i < 3; i++) {
            mesh(wing, geo.box, i % 2 ? woodGold : hide, side * (.148 - i * .031), .10 - i * .071, 0, .324 - i * .056, .068, .103);
          }
          mesh(totem, geo.box, eyes, side * .101, .723, .268, .087, .038, .024, false).rotation.z = side * .21;
          between(totem, geo.cone, bone, V(side * .15, .936, 0), V(side * .29, 1.225, -.046), .075);
        }
        addEffect(3.18, age => {
          const rise = backOut(clamp(age / .42));
          const sink = cubeInOut(clamp((age - 2.64) / .54));
          const pulse = .72 + .28 * Math.sin(age * 12) ** 2;
          totem.position.y = -1.36 + 1.39 * rise * (1 - sink);
          earthLight.position.set(position.x, totem.position.y + .84, position.z + .12);
          earthLight.intensity = 11 * pulse * clamp(rise) * (1 - sink);
          eyes.opacity = pulse * (1 - sink);
          glow.material.opacity = .66 * pulse * (1 - sink);
        }, () => {
          totem.removeFromParent();
          eyes.dispose();
          glow.material.dispose();
          earthLight.intensity = 0;
        });
      }

      function castEarthquake(spell) {
        const foot = shaman.staff.localToWorld(V(.07, -1.22, -.034));
        const epicenter = V(foot.x, .04, foot.z);
        const target = getTargetPosition();
        const targetGround = V(target.x, .02, target.z);
        const distance = epicenter.distanceTo(targetGround);
        makeRing(epicenter, '#9eea71', distance + 1.8, 1.08, { thickness: true, opacity: .83 });
        makeRing(epicenter, '#719c52', distance + 1.9, .98, { delay: .095, opacity: .68 });
        makeRing(epicenter, '#dcf898', 1.95, .66, { delay: .036 });
        createParticleBurst({ position: epicenter, count: 81, color: '#c1c693', endColor: '#6b7251', speed: 3.4,
          gravity: -2.1, life: .97, size: .31, spread: .2, opacity: .64 });
        makePulse(epicenter.clone().add(V(0, .12, 0)), '#a9ff80', .63, .33, .42);
        const spikeMaterial = material('#536753', { emissive: '#6ca148', emissiveIntensity: .22 });
        const rocks = group(scene);

        const spikes = Array.from({ length: 9 }, (_, i) => {
          const point = epicenter.clone().lerp(targetGround, (i + 1) / 9.5);
          point.z += range(-.21, .21);
          if (i === 8) point.z += .23;
          const height = range(.48, .83) + i * .056;
          const rock = mesh(rocks, i % 3 ? geo.cone : geo.dodeca, spikeMaterial, point.x, -height, point.z,
            range(.21, .38), height, range(.20, .38));
          rock.rotation.set(range(-.28, .36), range(0, tau), range(-.24, .22));
          return { rock, point, height, delay: i * .04, erupted: false };
        });

        let targetHit = false;
        addEffect(1.49, age => {
          for (const spike of spikes) {
            const time = age - spike.delay;
            if (time < 0) continue;
            const rise = backOut(clamp(time / .19));
            const fall = cubeInOut(clamp((time - .73) / .40));
            spike.rock.position.y = spike.height * (lerp(-1.15, .43, rise * (1 - fall)));
            if (!spike.erupted) {
              spike.erupted = true;
              createParticleBurst({ position: spike.point, count: 11, color: '#a9c68a', endColor: '#727650', speed: 1.85,
                lift: .15, gravity: -3.4, life: .62, size: .24, spread: .17, opacity: .66 });
            }
          }
          if (age >= .32 && !targetHit) {
            targetHit = true;
            hitTarget(spell, 8.4);
            makePulse(getTargetPosition(), '#aaff79', .57, .31, .48);
          }
        }, () => {
          rocks.removeFromParent();
          spikeMaterial.dispose();
        });

        createEarthTotem(V(epicenter.x - .63, 0, epicenter.z + .49));
        addShake(.30, .16);
        playSound('quake');
      }

      // Timing, cooldowns, and channel particles run on the same clock.
      let cast = null;
      let mana = 100;
      const cooldowns = { lightning: 0, fireball: 0, earthquake: 0 };
      const buttons = Object.fromEntries(
        [...document.querySelectorAll('[data-spell]')].map(button => [button.dataset.spell, {
          button, sweep: button.querySelector('.cooldown'), deniedUntil: 0
        }])
      );
      const manaFill = document.querySelector('#mana-fill');
      const manaMeter = document.querySelector('#mana');
      const manaValue = document.querySelector('#mana-value');
      const status = document.querySelector('#status');
      const soundButton = document.querySelector('#sound');
      let statusUntil = 0;
      let time = 0;

      function castSpell(type) {
        const spell = SPELLS[type];
        if (cast || time < cooldowns[type]) return;
        prepareAudio();
        if (mana < spell.cost) {
          const entry = buttons[type];
          entry.button.classList.remove('denied');
          void entry.button.offsetWidth;
          entry.button.classList.add('denied');
          entry.deniedUntil = time + .34;
          status.textContent = `Need ${spell.cost} mana to cast ${spell.name}.`;
          statusUntil = time + 1.25;
          return;
        }
        mana -= spell.cost;
        cooldowns[type] = time + spell.cooldown;
        cast = { type, spell, elapsed: 0, released: false, nextSpark: 0, orb: type === 'fireball' ? createFireOrb() : null };
        status.textContent = '';
        if (cast.orb) cast.orb.update(palmPosition(), .08, 0);
        updateUI(0);
      }

      function updateCasting(dt) {
        if (!cast) {
          updatePose(null, 0, time);
          return;
        }
        const { type, spell } = cast;
        cast.elapsed += dt;
        const elapsed = cast.elapsed;
        if (elapsed >= spell.release && !cast.released) {
          cast.released = true;
          updatePose(type, spell.release, time);
          updateCrystal(time);
          if (type === 'lightning') castLightning(spell);
          if (type === 'fireball') castFireball(spell, cast.orb);
          if (type === 'earthquake') castEarthquake(spell);
        }
        if (elapsed >= spell.duration) {
          cast = null;
          updatePose(null, 0, time);
          return;
        }
        updatePose(type, elapsed, time);
        if (cast.released) return;

        if (type === 'fireball') {
          cast.orb.update(palmPosition(), .08 + .96 * cubeOut(elapsed / spell.release), elapsed);
        }
        if (elapsed < cast.nextSpark) return;
        cast.nextSpark = elapsed + .027;
        if (type === 'lightning') {
          createParticleBurst({ position: getStaffTipWorldPosition(), count: 4, color: '#b6eaff', endColor: '#3d82fa',
            speed: 1.3, life: .34, size: .12, spread: .21 });
        }
        if (type === 'earthquake') {
          for (let i = 0; i < 5; i++) {
            const angle = range(0, tau);
            const radius = range(1.35, 1.83);
            createParticleBurst({ position: V(-1.25 + Math.cos(angle) * radius, .06, Math.sin(angle) * radius),
              count: 1, color: '#acbf8b', endColor: '#62694a', speed: .72, lift: .53, life: .54, size: .23, opacity: .58 });
          }
        }
      }

      function updateCrystal(t) {
        let strength = 0;
        if (cast) {
          const { elapsed, spell } = cast;
          strength = elapsed <= spell.release ? cubeOut(clamp(elapsed / spell.release)) :
            1 - cubeInOut(clamp((elapsed - spell.release) / (spell.duration - spell.release)));
        }
        spellColor.copy(idleCrystal);
        if (cast) spellColor.lerp(new THREE.Color(cast.spell.color), strength);
        const flicker = cast?.type === 'lightning' ? .83 + .32 * Math.sin(t * 84) ** 2 : 1;
        shaman.crystal.position.y = 1.011 + Math.sin(t * 3.4) * .047;
        shaman.crystal.rotation.y = t * .99;
        shaman.crystal.rotation.z = .12 * Math.sin(t * 1.8);
        shaman.crystal.material.color.copy(spellColor).multiplyScalar(.63);
        shaman.crystal.material.emissive.copy(spellColor);
        shaman.crystal.material.emissiveIntensity = (1.14 + strength * 2.05 + Math.sin(t * 3.2) * .12) * flicker;
        shaman.crystalGlow.position.copy(shaman.crystal.position);
        shaman.crystalGlow.material.color.copy(spellColor);
        shaman.crystalGlow.material.opacity = (.55 + strength * .40 + Math.sin(t * 2.9) * .055) * flicker;
        shaman.crystalGlow.scale.set(1.22 + strength * .80, 1.22 + strength * .80, 1);
        shaman.light.color.copy(spellColor);
        shaman.light.intensity = (5.3 + .95 * Math.sin(t * 2.7) + strength * 17) * flicker;
        shaman.eyeMaterial.emissive.copy(idleEyes).lerp(spellColor, strength);
      }

      let campEmber = 0;
      function updateIdle(t) {
        updateCrystal(t);
        shaman.feathers.forEach(({ pivot, angle }, i) => {
          pivot.rotation.z = angle + .065 * Math.sin(t * 2 + i * .8);
          pivot.rotation.x = .08 * Math.sin(t * 1.8 + i * 1.1);
        });
        shaman.hangings.forEach((hanging, i) => {
          hanging.rotation.x = .15 * Math.sin(t * 2.2 + i);
          hanging.rotation.z = .13 * Math.sin(t * 2.45 + i * 1.4);
        });

        const { camp, light, flames, glow } = environment;
        light.intensity = 11 + 2.7 * Math.sin(t * 24.1) + 1.5 * Math.sin(t * 38.1);
        glow.material.opacity = .49 + Math.sin(t * 12.2) * .07;
        for (const { flame, phase, x, z, height } of flames) {
          const wave = t * 8 + phase;
          const h = height * (.83 + .26 * Math.sin(wave));
          flame.position.set(x + Math.sin(wave * .7) * .04, .10 + h * .48, z);
          flame.rotation.set(Math.sin(wave + 1) * .31, wave * .52, Math.cos(wave) * .24);
          flame.scale.set(.13 + .026 * Math.sin(wave), h, .125);
        }
        if (t >= campEmber) {
          campEmber = t + .057;
          createParticleBurst({ position: camp.position.clone().add(V(0, .34, 0)), count: 2, color: '#ffd187', endColor: '#c84a29',
            speed: .39, lift: .59, life: 1.19, size: .086, spread: .13, opacity: .81 });
        }
      }

      // Procedural audio starts only after a keypress or button press.
      let audio;
      let master;
      let noise;
      let muted = false;

      function prepareAudio() {
        if (muted) return;
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;
        if (!audio) {
          audio = new Context();
          master = audio.createGain();
          master.gain.value = .64;
          master.connect(audio.destination);
          noise = audio.createBuffer(1, Math.ceil(audio.sampleRate * 1.4), audio.sampleRate);
          const samples = noise.getChannelData(0);
          for (let i = 0; i < samples.length; i++) samples[i] = range(-1, 1);
        }
        if (audio.state === 'suspended') audio.resume().catch(() => {});
      }

      function soundEnvelope(start, duration, volume, attack) {
        const level = audio.createGain();
        level.gain.setValueAtTime(.0001, start);
        level.gain.exponentialRampToValueAtTime(volume, start + attack);
        level.gain.exponentialRampToValueAtTime(.0001, start + duration);
        level.connect(master);
        return level;
      }

      function tone({ start, duration, high, low, volume, type = 'sine', attack = .012 }) {
        const oscillator = audio.createOscillator();
        const envelope = soundEnvelope(start, duration, volume, attack);
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(high, start);
        oscillator.frequency.exponentialRampToValueAtTime(low, start + duration);
        oscillator.connect(envelope);
        oscillator.start(start);
        oscillator.stop(start + duration);
        oscillator.onended = () => {
          oscillator.disconnect();
          envelope.disconnect();
        };
      }

      function noiseSweep({ start, duration, from, to, volume, type, attack = .017, resonance = .7 }) {
        const source = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const envelope = soundEnvelope(start, duration, volume, attack);
        source.buffer = noise;
        filter.type = type;
        filter.Q.value = resonance;
        filter.frequency.setValueAtTime(from, start);
        filter.frequency.exponentialRampToValueAtTime(to, start + duration);
        source.connect(filter);
        filter.connect(envelope);
        source.start(start, range(0, noise.duration - duration), duration);
        source.onended = () => {
          source.disconnect();
          filter.disconnect();
          envelope.disconnect();
        };
      }

      function playSound(type) {
        if (!audio || muted || audio.state !== 'running') return;
        const start = audio.currentTime + .007;
        switch (type) {
          case 'zap':
            noiseSweep({ start, duration: .21, from: 1800, to: 670, volume: .26, type: 'highpass', attack: .007 });
            tone({ start, duration: .21, high: 840, low: 103, volume: .09, type: 'triangle', attack: .006 });
            break;
          case 'whoosh':
            noiseSweep({ start, duration: .36, from: 1150, to: 160, volume: .22, type: 'bandpass', attack: .062, resonance: 1.26 });
            tone({ start, duration: .29, high: 207, low: 75, volume: .044, type: 'triangle', attack: .045 });
            break;
          case 'boom':
            noiseSweep({ start, duration: .48, from: 780, to: 115, volume: .23, type: 'lowpass' });
            tone({ start, duration: .47, high: 125, low: 37, volume: .22 });
            break;
          case 'quake':
            noiseSweep({ start, duration: 1.1, from: 460, to: 92, volume: .4, type: 'lowpass', attack: .10 });
            tone({ start, duration: .59, high: 93, low: 33, volume: .30 });
            tone({ start: start + .09, duration: .8, high: 53, low: 37, volume: .11, type: 'triangle', attack: .11 });
            break;
        }
      }

      function setupUI() {
        for (const [type, { button }] of Object.entries(buttons)) {
          const { name, cost, cooldown } = SPELLS[type];
          button.querySelector('.cost').textContent = cost;
          button.setAttribute('aria-label', `${name}, ${cost} mana`);
          button.title = `${name} · ${cost} mana · ${cooldown} s cooldown`;
          button.disabled = false;
          button.addEventListener('click', () => castSpell(type));
        }
        const keys = { '1': 'lightning', q: 'lightning', '2': 'fireball', w: 'fireball', '3': 'earthquake', e: 'earthquake' };
        window.addEventListener('keydown', event => {
          if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
          const type = keys[event.key.toLowerCase()];
          if (type) {
            event.preventDefault();
            castSpell(type);
          }
        });
        soundButton.disabled = false;
        soundButton.addEventListener('click', () => {
          muted = !muted;
          if (!muted) prepareAudio();
          if (master) master.gain.setTargetAtTime(muted ? .0001 : .64, audio.currentTime, .018);
          soundButton.setAttribute('aria-pressed', String(muted));
          soundButton.title = muted ? 'Unmute sound' : 'Mute sound';
        });
      }

      function updateUI(dt) {
        mana = Math.min(100, mana + dt * 8);
        const shownMana = Math.floor(mana);
        if (manaMeter.getAttribute('aria-valuenow') !== String(shownMana)) {
          manaMeter.setAttribute('aria-valuenow', shownMana);
          manaValue.textContent = `${shownMana} / 100`;
        }
        manaFill.style.transform = `scaleX(${mana / 100})`;
        for (const [type, entry] of Object.entries(buttons)) {
          const remaining = Math.max(0, cooldowns[type] - time);
          const readout = remaining >= 1 ? Math.ceil(remaining).toString() : remaining > 0 ? remaining.toFixed(1) : '';
          entry.button.classList.toggle('cooling', remaining > 0);
          entry.button.classList.toggle('casting', cast?.type === type);
          if (entry.deniedUntil <= time) entry.button.classList.remove('denied');
          if (entry.sweep.textContent !== readout) entry.sweep.textContent = readout;
          if (remaining > 0) entry.button.style.setProperty('--sweep', `${remaining / SPELLS[type].cooldown * 360}deg`);
        }
        if (time >= statusUntil && status.textContent) status.textContent = '';
      }

      const projection = V();
      const cameraOffset = V();
      const cameraPosition = V();
      const defaultTarget = V(.20, 1.39, .04);
      const defaultOffset = V(1.76, 1.72, 8.61);
      let width;
      let height;

      function resize(initial = false) {
        const previousAspect = camera.aspect;
        width = stage.clientWidth;
        height = stage.clientHeight;
        camera.aspect = width / height;
        const distanceScale = aspect => Math.max(1, 1 / aspect);
        const portraitBlend = aspect => clamp((.91 - aspect) / .47);
        const distance = distanceScale(camera.aspect);
        const portrait = portraitBlend(camera.aspect);
        controls.maxDistance = Math.max(21, defaultOffset.length() * distance * 1.15);
        scene.fog.density = .052 / Math.sqrt(distance);

        if (initial) {
          controls.target.copy(defaultTarget);
          controls.target.x += portrait * .16;
          cameraOffset.copy(defaultOffset).applyAxisAngle(up, portrait * .24).multiplyScalar(distance);
        } else {
          const portraitChange = portrait - portraitBlend(previousAspect);
          cameraOffset.copy(camera.position).sub(controls.target)
            .applyAxisAngle(up, portraitChange * .24).multiplyScalar(distance / distanceScale(previousAspect));
          controls.target.x += portraitChange * .16;
        }
        camera.position.copy(controls.target).add(cameraOffset);
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
        particlesMaterial.uniforms.pixelScale.value = height * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
        controls.update();
      }

      function placeLabel(label, position) {
        projection.copy(position).project(camera);
        const visible = projection.z >= -1 && projection.z <= 1 && Math.abs(projection.x) < 1 && Math.abs(projection.y) < 1;
        label.hidden = !visible;
        if (visible) {
          const x = (projection.x * .5 + .5) * width;
          const y = (.5 - projection.y * .5) * height;
          label.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
        }
      }

      function updateLabels(dt) {
        placeLabel(targetLabel, dummy.footing.localToWorld(V(0, 2.52, .05)));
        for (let i = numbers.length - 1; i >= 0; i--) {
          const number = numbers[i];
          number.age += dt;
          if (number.age >= 1.04) {
            number.label.remove();
            numbers.splice(i, 1);
            continue;
          }
          number.origin.y += dt * .68;
          number.label.style.opacity = 1 - (number.age / 1.04) ** 2.3;
          placeLabel(number.label, number.origin);
        }
      }

      function animate() {
        const dt = Math.min(clock.getDelta(), .12);
        time += dt;
        controls.update();
        updateDummy(dt);
        updateCasting(dt);
        updateIdle(time);
        updateEffects(dt);
        updateParticles(Math.min(dt, .05), time);
        updateUI(dt);

        cameraPosition.copy(camera.position);
        if (shakeRemaining > 0) {
          const intensity = shakeStrength * (shakeRemaining / shakeTime) ** 1.3;
          camera.position.add(cameraOffset.set(Math.sin(time * 138), Math.cos(time * 175) * .72, Math.sin(time * 183) * .29).multiplyScalar(intensity));
          shakeRemaining = Math.max(0, shakeRemaining - dt);
        }
        flashLayer.style.opacity = (flashRemaining / .13) ** 2 * .3;
        flashRemaining = Math.max(0, flashRemaining - dt);
        camera.updateMatrixWorld();
        updateLabels(dt);

        renderer.render(scene, camera);
        camera.position.copy(cameraPosition);
        requestAnimationFrame(animate);
      }

      setupLights();
      const environment = createEnvironment();
      const shaman = createShaman();
      const dummy = createDummy();
      resize(true);
      setupUI();
      window.addEventListener('resize', () => resize());
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) clock.getDelta();
      });
      clock.start();
      animate();
      loading.hidden = true;
    }
  </script>
</body>
</html>
